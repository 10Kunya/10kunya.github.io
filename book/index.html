<style>
:root{
  color-scheme: dark;
  --bg:#141210; --card:#1B1815; --gold-bg:#1E1A15;
  --line:#221F1B; --line2:#2E2925; --gold-line:#6B5A3E;
  --text:#E6DFD4; --mute:#857C70; --dim:#4A443D;
  --gold:#C9A66B; --warn:#C49384; --ok:#9DB58A;
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
  --serif:'Cormorant Garamond','Noto Serif Thai',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:440px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom))}
.sv{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-weight:500}
.mu{color:var(--mute);font-size:13px}
.au{color:var(--gold)}
.ti{vertical-align:-2px}

.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.brand{font-size:24px;letter-spacing:.5px}

.chips{display:grid;gap:8px}
.chip{border:1px solid var(--line2);border-radius:10px;padding:9px 0;text-align:center;transition:border-color .15s,background .15s}
.chip.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.chip.off{color:var(--dim);border-style:dashed;cursor:default}
.chip small{display:block;color:var(--mute);font-size:12px}
.chip.on small{color:var(--gold)}

.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2);padding:4px 0}
.field i{color:var(--mute);font-size:18px}
.field input{flex:1;background:transparent;border:0;outline:0;padding:10px 0;font-size:16px}
.field input::placeholder{color:var(--dim)}
.field:focus-within{border-color:var(--gold-line)}
.err{color:var(--warn);font-size:13px;min-height:0;margin-top:4px}
.err:empty{display:none}

.btn{display:block;width:100%;background:var(--gold);color:var(--bg);border-radius:12px;padding:14px;text-align:center;font-weight:500;font-size:16px}
.btn:active{transform:scale(.98)}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.busy{opacity:.6;pointer-events:none}
.link{color:var(--mute);font-size:14px;text-align:center;display:block;width:100%;padding:12px}

.card{border:1px solid var(--gold-line);border-radius:14px}
.ring{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:21px;flex-shrink:0}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:440px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{font-size:23px;color:var(--dim);padding:6px 16px}
.nav button.on{color:var(--gold)}

.shade{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);background:rgba(8,7,6,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.shade.under{display:none}
.sheet{position:relative;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:26px 20px calc(22px + env(safe-area-inset-bottom));max-height:88%;overflow:auto;overscroll-behavior:contain;animation:up .2s ease-out}
.grab{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line2)}
.sx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;color:var(--mute);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:1}
.sheet h3{padding-right:36px}
@media (min-width:700px){
  .shade{align-items:center;padding:24px}
  .sheet{border-radius:20px;border-bottom:1px solid var(--line2);max-width:520px;max-height:85%;padding:28px 26px 24px;animation:pop .18s ease-out}
  .grab{display:none}
}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sheet h3{margin:0 0 14px;font-weight:500;font-size:20px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.act i{font-size:20px;color:var(--mute);width:22px}
.act.gold i,.act.gold{color:var(--gold)}
.act.warn i,.act.warn{color:var(--warn)}
.act:last-child{border-bottom:0}

.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:20px;padding:2px 10px;font-size:12px;white-space:nowrap}
.bar{height:4px;background:var(--line2);border-radius:2px;margin:6px 0 4px;overflow:hidden}
.bar div{height:100%;background:var(--gold);border-radius:2px}
.rw{border:1px solid var(--line2);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;width:100%;text-align:left}
.rw i{font-size:18px}
.rw.dim{opacity:.5}
.rw.can{border-color:var(--gold-line)}

.tm-t{font-size:20px;margin-bottom:2px;padding-right:36px}
.tm-h{color:var(--gold);font-size:14px;margin:18px 0 6px}
.tm-r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tm-n{min-width:84px;text-align:right;font-family:var(--serif);font-variant-numeric:lining-nums;font-size:17px}
.tm ul{margin:0;padding-left:20px;line-height:1.8}
/* เปิดให้ลูกค้าดูบนจอช่าง: เต็มจอ ตัวใหญ่ */
.shade.full{padding:0;align-items:stretch}
.shade.full .sheet{max-width:none;max-height:none;height:100%;border-radius:0;border:0;padding:calc(30px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
.shade.full .tm{max-width:640px;margin:0 auto;font-size:19px}
.shade.full .tm-t{font-size:28px}
.shade.full .tm .mu{font-size:16px}
.shade.full .tm-h{font-size:18px;margin-top:24px}
.shade.full .tm-r{padding:12px 0}
.shade.full .tm-n{font-size:22px;min-width:110px}
.shade.full .sx{top:calc(14px + env(safe-area-inset-top));font-size:26px;width:48px;height:48px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:14px;z-index:30;animation:fade .15s;white-space:nowrap}
.load{display:flex;justify-content:center;padding:80px 0;color:var(--dim);font-size:26px}
.load i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
</style>

<style>
.wheel-wrap{position:relative;margin:0 -20px 12px}
.wheel{--iw:76px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - var(--iw) / 2);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel button{flex:0 0 var(--iw);height:72px;scroll-snap-align:center;font-family:var(--serif);font-variant-numeric:lining-nums;font-weight:500;font-size:21px;color:var(--dim);transition:color .15s,font-size .15s}
.wheel button.mid{color:var(--text);font-size:32px}
.wheel-wrap{--iw:76px}
@media (min-width:700px){
  .wrap{max-width:520px}
  .wheel,.wheel-wrap{--iw:100px}
  .wheel button{height:92px;font-size:26px}
  .wheel button.mid{font-size:42px}
}
.wheel .bx{font-family:var(--sans);font-size:11px;color:var(--gold);margin-left:2px}
.wheel-mark{position:absolute;left:50%;top:6px;bottom:6px;width:calc(var(--iw) + 8px);margin-left:calc(var(--iw) / -2 - 4px);border:1px solid var(--gold-line);border-radius:12px;pointer-events:none}
.msg{font-size:13px;margin-bottom:10px;min-height:20px}
.msg.warn{color:var(--warn)}
.msg.ok{color:var(--ok)}
.tk-top{padding:28px 18px 22px;text-align:center}
.tk-time{font-size:54px;line-height:1.15;margin-top:10px}
.tk-bar{border-top:1px dashed var(--gold-line);display:flex;justify-content:space-around;padding:6px 2px}
.tk-bar a,.tk-bar button{color:var(--mute);font-size:21px;padding:8px 4px;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.tk-bar small{font-size:11px;line-height:1.2}
.tk-bar .warn{color:var(--warn)}
.a2hs{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--gold-line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.a2hs .ic{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.a2hs .x{color:var(--mute);font-size:18px;padding:8px;margin:-8px -6px -8px 0}
.hs-st{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.5}
.hs-st:last-of-type{border-bottom:0}
.hs-n{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--serif)}
.shopnote{border:1px solid var(--gold-line);background:var(--gold-bg);border-radius:12px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px;line-height:1.55;white-space:pre-line;word-break:break-word}
.shopnote .ti{color:var(--gold);font-size:20px;margin-top:1px}
#notebox textarea{width:100%;background:transparent;border:1px solid var(--line2);border-radius:10px;outline:0;padding:10px 12px;font-size:16px;line-height:1.5;resize:none;margin-top:8px}
#notebox textarea:focus{border-color:var(--gold-line)}
#notebox textarea::placeholder{color:var(--dim)}
.wa{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);color:var(--mute);font-size:18px;display:flex;align-items:center;justify-content:center;z-index:1}
.wa:active{color:var(--gold);border-color:var(--gold-line)}
.wa.l{left:10px}.wa.r{right:10px}
</style>

<body>
<div class="wrap" id="app"><div class="load"><i class="ti ti-scissors"></i></div></div>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toMin = t => { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); };
const toHM = m => ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);

const WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const WD_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const MO = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const MO_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const ymd = ds => ds.split('-').map(Number);
const wday = ds => { const p = ymd(ds); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); };
const addDays = (ds, n) => { const p = ymd(ds); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
const dShort = ds => WD[wday(ds)] + ' ' + ymd(ds)[2] + ' ' + MO[ymd(ds)[1] - 1];
const dLong = ds => 'วัน' + WD_FULL[wday(ds)] + ' ' + ymd(ds)[2] + ' ' + MO_FULL[ymd(ds)[1] - 1];
function dRel(ds, today) {
  const n = Math.round((Date.parse(ds) - Date.parse(today)) / 864e5);
  return n === 0 ? 'วันนี้' : n === 1 ? 'พรุ่งนี้' : n === 2 ? 'มะรืน' : WD[wday(ds)];
}
function closedText(days) {
  if (!days || !days.length) return 'เปิดทุกวัน';
  return 'หยุดวัน' + days.slice().sort().map(d => WD_FULL[d]).join(' ');
}

// เรียก Apps Script แบบไม่ส่งคุกกี้ Google (กันปัญหามือถือที่ล็อกอินหลายบัญชี)
const API_URL = 'https://script.google.com/macros/s/AKfycbxikYAE-wSNLOwdfVX2vK9Em2K1RQ-oap9v9WsbMzxUCD0PcSSpfxBRWHtXtjoZhPW8/exec';
async function call(fn, ...args) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit' });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.result;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let toastT;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), 2400);
}

/*** ---------- หน้าต่างเด้งจากล่าง ---------- ***/
// ปิดได้ 4 ทาง: ปุ่ม ✕ · แตะพื้นหลัง · ปัดลง · ปุ่มย้อนกลับของมือถือ
function makeShade(html, onClick) {
  const sh = document.createElement('div');
  sh.className = 'shade';
  sh.innerHTML = '<div class="sheet"><div class="grab"></div><button class="sx" data-close aria-label="ปิด"><i class="ti ti-x"></i></button><div class="sbody">' + html + '</div></div>';
  sh.addEventListener('click', e => {
    if (e.target === sh || e.target.closest('[data-close]')) return popSheet();
    const b = e.target.closest('[data-a]');
    if (b && onClick) onClick(b.dataset.a, b, sh);
  });
  swipeToClose($('.sheet', sh));
  return sh;
}
function openSheet(html, onClick, stack) {
  if (stack) { const prev = $('.shade:not(.under)'); if (prev) prev.classList.add('under'); } else closeSheet();
  const sh = makeShade(html, onClick);
  document.body.appendChild(sh);
  document.body.classList.add('lock');
  return sh;
}
// หน้าต่างย่อยที่ซ้อนบนหน้าต่างเดิม — กดกลับ/ปิดแล้วกลับไปหน้าต่างเดิม
const stackSheet = (html, onClick) => openSheet(html, onClick, true);
// ปิดทุกหน้าต่าง (ใช้หลังทำรายการเสร็จ)
function closeSheet() {
  document.querySelectorAll('.shade').forEach(s => s.remove());
  document.body.classList.remove('lock');
}
// ปิดเฉพาะหน้าต่างบนสุด — ถ้าข้างใต้มีหน้าต่างเดิม (เช่นกล่องยืนยัน) ให้กลับไปที่หน้าต่างนั้น
function popSheet() {
  const all = document.querySelectorAll('.shade');
  if (!all.length) return false;
  all[all.length - 1].remove();
  const prev = all[all.length - 2];
  if (prev) prev.classList.remove('under'); else document.body.classList.remove('lock');
  return true;
}
// กล่องยืนยัน: ซ้อนบนหน้าต่างเดิม กด "ไม่" แล้วกลับไปหน้าต่างเดิม
function askConfirm(title, okText, cb, noText) {
  const prev = $('.shade:not(.under)');
  if (prev) prev.classList.add('under');
  const sh = makeShade('<h3>' + esc(title) + '</h3>' +
    '<button class="btn" data-a="yes" style="margin-top:6px">' + esc(okText) + '</button>' +
    '<button class="link" data-a="no">' + esc(noText || 'กลับ') + '</button>',
    a => { if (a === 'yes') { closeSheet(); cb(); } else popSheet(); });
  document.body.appendChild(sh);
  document.body.classList.add('lock');
}
// ปัดหน้าต่างลงเพื่อปิด (ทำงานเมื่อเลื่อนเนื้อหาขึ้นไปบนสุดแล้ว)
function swipeToClose(sheet) {
  let y0 = 0, dy = 0, on = false;
  sheet.addEventListener('touchstart', e => { on = sheet.scrollTop <= 0; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!on) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { e.preventDefault(); sheet.style.transform = `translateY(${dy}px)`; sheet.style.transition = 'none'; }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (!on) return;
    sheet.style.transition = 'transform .18s'; sheet.style.transform = '';
    if (dy > 90) popSheet();
    on = false;
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.shade')) popSheet(); });

// ให้หน้าต่างอยู่เหนือคีย์บอร์ด (iPhone ไม่ย่อหน้าจอให้เอง)
if (window.visualViewport) {
  const fit = () => document.documentElement.style.setProperty('--vvh', visualViewport.height + 'px');
  visualViewport.addEventListener('resize', fit);
  fit();
}

/*** ---------- ปุ่มย้อนกลับของมือถือ (Android ปุ่มกลับ · iPhone ปัดขอบจอ) ---------- ***/
// หน้าเว็บกำหนด window.appBack = { need: () => มีอะไรให้ถอยไหม, handle: () => ถอย 1 ขั้น }
// วิธีทำงาน: ขณะที่มีอะไรให้ถอย จะมีประวัติหน้าเว็บสำรองไว้ 1 ชั้น กดกลับแล้วถอยในแอปแทนการออกจากเว็บ
const HB = { armed: false, skip: false, t: 0 };
function backSync() {
  clearTimeout(HB.t);
  HB.t = setTimeout(() => {
    const need = !!(window.appBack && appBack.need());
    if (need && !HB.armed) { history.pushState({ k10: 1 }, ''); HB.armed = true; }
    else if (!need && HB.armed) { HB.skip = true; HB.armed = false; history.back(); }
  }, 80);
}
window.addEventListener('popstate', () => {
  if (HB.skip) { HB.skip = false; return backSync(); }
  HB.armed = false;
  if (window.appBack) appBack.handle();
  backSync();
});
new MutationObserver(backSync).observe(document.body, { childList: true, subtree: true });

/*** ---------- บัตรสมาชิก (ใช้ทั้งหน้าลูกค้าและหน้าช่าง) ---------- ***/
const TIER_C = ['#B98260', '#C8C9CC', '#C9A66B', '#A9C3D9', '#C9B3DD'];
function tierBadge(t) {
  const c = TIER_C[t.idx % TIER_C.length];
  const ic = t.count > 1 && t.idx === t.count - 1 ? 'ti-crown' : 'ti-medal';
  return `<span class="badge" style="border-color:${c};color:${c}"><i class="ti ${ic}"></i> ${esc(t.name)}</span>`;
}
function memberCard(m) {
  const t = m.tier, nx = t.next;
  const pct = nx ? Math.max(0, Math.min(100, Math.round((m.lifetime - t.min) / (nx.min - t.min) * 100))) : 100;
  return `<div class="card" style="padding:16px 18px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span class="mu" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name || 'สมาชิก')} · ${esc(m.phone)}</span>${tierBadge(t)}
    </div>
    <div style="display:flex;align-items:baseline;gap:6px;margin:8px 0 2px">
      <span class="sv au" style="font-size:44px;line-height:1">${m.points}</span><span class="mu">แต้มใช้ได้</span>
    </div>
    <div class="mu" style="margin-bottom:14px">ตัด 1 ครั้ง ได้ <span class="au">+${t.earn}</span> แต้ม · มาแล้ว ${m.visits} ครั้ง</div>
    <div style="display:flex;justify-content:space-between" class="mu"><span>สะสมรวม ${m.lifetime}</span><span>${nx ? esc(nx.name) + ' ' + nx.min : 'ระดับสูงสุด'}</span></div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="mu">${nx ? `อีก ${nx.min - m.lifetime} แต้ม ขึ้นระดับ${esc(nx.name)}` : 'ได้แต้มต่อครั้งสูงสุดแล้ว'}</div>
  </div>`;
}
function rewardList(rewards, points, clickable) {
  if (!rewards.length) return '';
  return rewards.map((r, i) => {
    const can = points >= r.cost;
    const tag = clickable ? 'button' : 'div';
    return `<${tag} class="rw ${can ? 'can' : 'dim'}" ${clickable && can ? `data-a="redeem" data-i="${i}"` : ''}>
      <i class="ti ti-${esc(r.icon)} ${can ? 'au' : ''}"></i><span style="flex:1">${esc(r.name)}</span>
      <span class="sv ${can ? 'au' : ''}" style="font-size:17px">${r.cost}</span></${tag}>`;
  }).join('');
}

// เงื่อนไขสมาชิกและรางวัล (สร้างจากค่าที่ร้านตั้งไว้)
function termsHtml(t) {
  const tiers = t.tiers.slice().sort((a, b) => a.min - b.min), hd = (ic, x) => `<div class="tm-h"><i class="ti ti-${ic}"></i> ${x}</div>`;
  const days = b => [1, 2, 3, 4, 5, 6, 0].filter(n => b.days.indexOf(n) >= 0).map(n => WD[n]).join(' ');
  const extra = [
    t.birthdayBonus ? `เดือนเกิด: มาตัดครั้งแรกของเดือนเกิด +${t.birthdayBonus} แต้ม (ปีละครั้ง)` : '',
    t.referralBonus ? `ชวนเพื่อน: เพื่อนใหม่มาตัดครั้งแรก ได้คนละ +${t.referralBonus} แต้ม` : ''
  ].concat(t.boosts.map(b => `${days(b)} ${b.from}–${b.to} แต้ม ×${b.mult}`)).filter(Boolean);
  return `<div class="tm">
    <div class="tm-t">เงื่อนไขสมาชิกและรางวัล</div>
    <div class="mu">สมัครอัตโนมัติด้วยเบอร์โทรเมื่อมาตัดครั้งแรก</div>
    ${hd('medal', 'ระดับสมาชิก')}
    ${tiers.map((x, i) => `<div class="tm-r"><span style="flex:1;color:${TIER_C[i % TIER_C.length]}"><i class="ti ${tiers.length > 1 && i === tiers.length - 1 ? 'ti-crown' : 'ti-medal'}"></i> ${esc(x.name)}</span>
      <span class="mu">${i ? 'สะสมครบ ' + x.min : 'เริ่มต้น'}</span><span class="au tm-n">+${x.earn} / ครั้ง</span></div>`).join('')}
    ${t.rewards.length ? hd('gift', 'รางวัล') + t.rewards.map(r => `<div class="tm-r"><i class="ti ti-${esc(r.icon)} au"></i><span style="flex:1">${esc(r.name)}</span><span class="au tm-n">${r.cost} แต้ม</span></div>`).join('') : ''}
    ${extra.length ? hd('bolt', 'แต้มพิเศษ') + '<ul>' + extra.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : ''}
    ${hd('info-circle', 'กติกา')}
    <ul class="mu"><li>แต้มไม่มีวันหมดอายุ</li><li>ระดับวัดจากแต้มสะสมรวม แลกรางวัลแล้วระดับไม่ลด</li><li>แลกรางวัลที่ร้าน แจ้งช่างตอนมาตัด</li>
      ${t.note ? t.note.split(/\n+/).filter(Boolean).map(x => `<li style="color:var(--text)">${esc(x)}</li>`).join('') : ''}</ul></div>`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('คัดลอกแล้ว'); }
  catch (e) {
    const sh = openSheet('<h3>คัดลอกลิงก์</h3><div class="field"><input readonly value="' + esc(text) + '"></div>' +
      '<button class="link" data-a="x">ปิด</button>', () => closeSheet());
    const i = $('input', sh); i.focus(); i.select();
  }
}
</script>

<script>
const URL_TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/\W/g, '');
const S = { d: null, day: '', time: '', pick: null, mode: 'book', resched: null, forOther: false };

/*** ---------- โหลด ---------- ***/
async function load(except) {
  const toks = store.get('k10_tickets', []);
  if (URL_TOKEN && toks.indexOf(URL_TOKEN) < 0) toks.push(URL_TOKEN);
  try {
    S.d = await call('getAvailability', toks, except || '');
  } catch (e) {
    if (!S.d) {   // ยังไม่เคยโหลดได้เลย → หน้าลองใหม่ (ถ้าเคยโหลดแล้ว คงหน้าเดิมไว้)
      $('#app').innerHTML = `<div style="text-align:center;padding:90px 0">
        <i class="ti ti-wifi-off" style="font-size:34px;color:var(--dim)"></i>
        <div style="margin:12px 0 4px">โหลดไม่สำเร็จ</div><div class="mu" style="margin-bottom:22px">ตรวจสัญญาณอินเทอร์เน็ต แล้วลองใหม่</div>
        <button class="btn" id="retry" style="max-width:220px;margin:0 auto"><i class="ti ti-refresh"></i> ลองใหม่</button></div>`;
      $('#retry').onclick = () => { $('#app').innerHTML = '<div class="load"><i class="ti ti-scissors"></i></div>'; start(); };
    }
    return false;
  }
  // ตั๋วที่ร้านยกเลิกให้ (ลูกค้ายกเลิกเองจะถูกลบออกจากเครื่องไปก่อนแล้ว) → แจ้งครั้งเดียว
  S.notice = (S.d.cancelled || []).slice();
  store.set('k10_tickets', S.d.tickets.map(t => t.token));
  S.loadedAt = Date.now();
  return true;
}

// ประกาศจากร้าน (ช่างตั้งในหน้าตั้งค่า)
function shopNoteHtml() {
  return S.d.notice ? `<div class="shopnote"><i class="ti ti-speakerphone"></i><span>${esc(S.d.notice)}</span></div>` : '';
}

// แถบแจ้งว่าร้านยกเลิกคิวให้
function noticeHtml() {
  if (!S.notice || !S.notice.length) return '';
  const n = S.notice; S.notice = [];
  return n.map(t => `<div class="card" style="padding:12px 14px;margin-bottom:16px;border-color:var(--warn);color:var(--warn);display:flex;gap:10px;align-items:center">
    <i class="ti ti-calendar-x" style="font-size:22px"></i><span style="flex:1">ร้านยกเลิกคิว ${dShort(t.date)} ${esc(t.time)} ของคุณ${esc(t.name)}แล้ว
    <span class="mu" style="display:block">จองเวลาใหม่ได้ด้านล่าง${S.d.phone ? ' หรือโทรถามร้าน' : ''}</span></span>
    ${S.d.phone ? `<a href="tel:${esc(S.d.phone)}" style="font-size:22px;padding:6px" aria-label="โทรหาร้าน"><i class="ti ti-phone"></i></a>` : ''}</div>`).join('');
}

// ทิ้งหน้าไว้นานแล้วกลับมา → โหลดคิวว่างใหม่ (กันเวลาที่ผ่านไปแล้ว/คิวที่ถูกจองไปแล้ว)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !S.d || Date.now() - (S.loadedAt || 0) < 60000 || $('.shade')) return;
  if (S.mode === 'book' && !S.resched) { const keep = S.time; if (await load()) { S.time = keep; showBook(); } }
  else if (S.mode === 'ticket') { if (await load()) S.d.tickets.length ? showTickets() : showBook(); }
});

async function start() {
  if (!await load()) return;
  S.d.tickets.length ? showTickets() : showBook();
}

/*** ---------- หน้าจอง ---------- ***/
function firstDay() {
  const d = S.d.days.find(x => !x.closed && x.free.length) || S.d.days.find(x => !x.closed) || S.d.days[0];
  return d.date;
}

// ทุกช่วงเวลาของวัน (ไม่บอกว่าช่วงไหนว่าง) — วันนี้ตัดช่วงที่ผ่านไปแล้วออก
function slotsOf(date) {
  const d = S.d, out = [], h = d.days.find(x => x.date === date) || d;
  for (let m = toMin(h.open); m + d.slotMin <= toMin(h.close); m += d.slotMin) {
    if (date === d.now.date && m <= d.now.min) continue;
    out.push(toHM(m));
  }
  return out;
}
function freeOf(date) { return (S.d.days.find(x => x.date === date) || { free: [] }).free; }

function showBook(resched, forOther) {
  S.mode = 'book';
  S.resched = resched || null;
  S.forOther = !!forOther;
  if (!S.day || !S.d.days.some(x => x.date === S.day && !x.closed)) S.day = firstDay();
  const me = store.get('k10_me', {});
  const d = S.d;
  $('#app').innerHTML = `
    <div class="head" style="align-items:flex-start">
      <div><div class="sv brand">${esc(d.shop)}</div>
      <div class="mu"><span id="hrs">${esc(d.open)} – ${esc(d.close)}</span> · ${esc(closedText(d.closedDays))}</div></div>
      ${S.resched ? '' : '<button id="mem" class="mu" style="font-size:13px;text-align:center"><i class="ti ti-id-badge-2 au" style="font-size:22px"></i><br>สมาชิก</button>'}
    </div>
    ${shopNoteHtml()}${noticeHtml()}
    ${S.resched ? `<div class="mu" style="margin:-8px 0 16px"><i class="ti ti-pencil"></i> เลื่อนคิวเดิม ${dShort(S.resched.date)} ${esc(S.resched.time)}</div>` : ''}
    ${S.forOther ? '<div class="mu" style="margin:-8px 0 16px"><i class="ti ti-user-plus"></i> จองให้คนอื่น · ใส่ชื่อและเบอร์ของคนที่จะมาตัด</div>' : ''}
    <div class="chips" id="days" style="grid-template-columns:repeat(${Math.min(d.days.length, 4)},1fr);margin-bottom:22px"></div>
    <div class="mu" style="margin-bottom:6px"><i class="ti ti-clock"></i> เลื่อนเลือกเวลา</div>
    <div class="wheel-wrap"><button class="wa l" data-step="-1" aria-label="เวลาก่อนหน้า"><i class="ti ti-chevron-left"></i></button>
      <div class="wheel" id="wh"></div><div class="wheel-mark"></div>
      <button class="wa r" data-step="1" aria-label="เวลาถัดไป"><i class="ti ti-chevron-right"></i></button></div>
    <div class="msg" id="msg"></div>
    <div class="chips sv" id="sugs" style="grid-template-columns:repeat(3,1fr);margin-bottom:22px"></div>
    ${S.resched ? '' : `<div id="who"></div>
    ${d.referralBonus ? `<details id="refbox" style="margin-top:10px"><summary class="mu" style="cursor:pointer;list-style:none"><i class="ti ti-users-plus"></i> มีเพื่อนแนะนำ? (ลูกค้าใหม่ · ได้คนละ ${d.referralBonus || 0} แต้ม)</summary>
      <div class="field"><i class="ti ti-phone"></i><input id="rf" placeholder="เบอร์ของเพื่อนที่แนะนำ" inputmode="tel" maxlength="12"></div>
      <div class="err" id="erf"></div></details>` : ''}`}
    <details id="notebox" style="margin-top:10px" ${S.resched && S.resched.note ? 'open' : ''}><summary class="mu" style="cursor:pointer;list-style:none"><i class="ti ti-message-plus"></i> ฝากข้อความถึงช่าง (ไม่ใส่ก็ได้)</summary>
      <textarea id="nt" rows="2" maxlength="100" placeholder="เช่น ขอรองทรงต่ำ / อาจมาสาย 10 นาที">${esc(S.resched ? S.resched.note || '' : '')}</textarea></details>
    <div class="err" id="ego" style="margin-top:14px"></div>
    <button class="btn" id="go" style="margin-top:18px"></button>
    ${S.resched ? '' : '<div class="mu" style="text-align:center;margin-top:10px;font-size:12px"><i class="ti ti-shield-lock"></i> ร้านเก็บชื่อและเบอร์ไว้เพื่อจองคิวและสะสมแต้มเท่านั้น</div>'}
    ${S.resched ? '<button class="link" id="back">กลับไปที่ตั๋ว</button>' : (d.tickets.length ? '<button class="link" id="back">ดูคิวของฉัน</button>' : '')}
  `;
  $('#app').onclick = null;
  renderDays();
  if (!S.resched) renderWho(S.forOther || !(me.name && me.phone));
  if ($('#mem')) $('#mem').onclick = () => showMember();
  $('#sugs').addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    if (b.dataset.d !== S.day) { S.day = b.dataset.d; renderDays(); renderWheel(b.dataset.t); }
    else spinTo(b.dataset.t, true);
  });
  $('#go').addEventListener('click', submit);
  if ($('#back')) $('#back').addEventListener('click', () => S.resched ? load().then(ok => ok && showTickets()) : showTickets());
  renderWheel(S.time);
}

// ชื่อ/เบอร์: พิมพ์ครั้งแรกครั้งเดียว ครั้งต่อไปแสดงเป็นบรรทัดเดียว
function renderWho(edit) {
  const me = S.forOther ? {} : store.get('k10_me', {}), box = $('#who');
  box.innerHTML = edit ? `
    <div class="field"><i class="ti ti-user"></i><input id="nm" placeholder="ชื่อ" maxlength="40" value="${esc(me.name || '')}" autocomplete="name"></div>
    <div class="err" id="enm"></div>
    <div class="field"><i class="ti ti-phone"></i><input id="ph" placeholder="เบอร์โทร" inputmode="tel" maxlength="12" value="${esc(me.phone || '')}" autocomplete="tel"></div>
    <div class="err" id="eph"></div>` : `
    <div class="row" style="border-bottom:1px solid var(--line2)">
      <i class="ti ti-user mu" style="font-size:18px"></i>
      <span style="flex:1">${esc(me.name)} <span class="mu">· ${esc(me.phone)}</span></span>
      <button class="au" id="chg" style="font-size:14px">เปลี่ยน</button>
    </div><div class="err" id="eph"></div>`;
  if (edit) ['nm', 'ph'].forEach(id => $('#' + id).addEventListener('input', () => $('#e' + id).textContent = ''));
  else $('#chg').onclick = () => renderWho(true);
}

function renderDays() {
  const box = $('#days'), day = S.d.days.find(x => x.date === S.day);
  if (day && day.open && $('#hrs')) $('#hrs').textContent = day.open + ' – ' + day.close;
  box.innerHTML = S.d.days.map(x => `
    <button class="chip ${x.closed ? 'off' : x.date === S.day ? 'on' : ''}" data-d="${x.date}">
      ${dRel(x.date, S.d.now.date)}<small>${x.closed ? 'ร้านหยุด' : WD[wday(x.date)] + ' ' + ymd(x.date)[2]}</small>
    </button>`).join('');
  box.onclick = e => {
    const b = e.target.closest('[data-d]'); if (!b || b.classList.contains('off') || b.dataset.d === S.day) return;
    S.day = b.dataset.d; renderDays(); renderWheel(S.time);
  };
}

/*** ---------- วงล้อเวลา (เลื่อนซ้าย-ขวา) ---------- ***/
// ความกว้างแต่ละช่องของวงล้อ (มือถือ 76 / แท็บเล็ต 100) อ่านจากหน้าจอจริง
const itemW = () => { const b = $('#wh') && $('#wh').firstElementChild; return (b && b.offsetWidth) || 76; };
let spinT;
// ตัวคูณแต้มของเวลานั้น (ตามที่ร้านตั้งไว้)
function boostOf(ds, t) {
  const wd = wday(ds), m = toMin(t);
  const b = (S.d.boosts || []).find(x => x.days.indexOf(wd) >= 0 && m >= toMin(x.from) && m < toMin(x.to));
  return b ? b.mult : 1;
}

function renderWheel(want) {
  const wh = $('#wh'), list = slotsOf(S.day), free = freeOf(S.day);
  if (!list.length) {
    wh.innerHTML = '<div class="mu" style="padding:22px 0;width:100%;text-align:center">วันนี้ปิดรับคิวแล้ว</div>';
    S.time = ''; S.pick = null; evaluate();
    return;
  }
  wh.innerHTML = list.map(t => { const x = boostOf(S.day, t); return `<button data-w="${t}">${t}${x > 1 ? `<sup class="bx">×${x}</sup>` : ''}</button>`; }).join('');
  const start = list.indexOf(want) >= 0 ? want : (free[0] || list[0]);
  wh.onscroll = () => {
    markMid();
    clearTimeout(spinT);
    spinT = setTimeout(() => {
      const t = list[Math.max(0, Math.min(list.length - 1, Math.round(wh.scrollLeft / itemW())))];
      if (t !== S.time) { S.time = t; S.pick = null; evaluate(); }
    }, 120);
  };
  wh.onclick = e => { const b = e.target.closest('[data-w]'); if (b) spinTo(b.dataset.w, true); };
  wh.onwheel = e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); wh.scrollLeft += e.deltaY; } };
  wh.tabIndex = 0;
  const step = n => { const b = wh.children[Math.round(wh.scrollLeft / itemW()) + n]; if (b && b.dataset.w) spinTo(b.dataset.w, true); };
  wh.onkeydown = e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    step(e.key === 'ArrowRight' ? 1 : -1);
  };
  document.querySelectorAll('.wa').forEach(b => { b.onclick = () => step(+b.dataset.step); });
  spinTo(start, false);
  S.time = start; S.pick = null; evaluate();
}
function spinTo(t, smooth) {
  const wh = $('#wh'), i = [...wh.children].findIndex(b => b.dataset.w === t);
  if (i < 0) return;
  wh.scrollTo({ left: i * itemW(), behavior: smooth ? 'smooth' : 'auto' });
  markMid();
}
function markMid() {
  const wh = $('#wh'), i = Math.round(wh.scrollLeft / itemW());
  [...wh.children].forEach((b, j) => b.classList.toggle('mid', j === i));
}

// ช่วงว่างที่ใกล้เวลาที่ขอที่สุด k ช่วง (เรียงตามเวลา) + ช่วงที่ใกล้สุดจริง
function nearest(free, m, k) {
  const by = free.slice().sort((a, b) => Math.abs(toMin(a) - m) - Math.abs(toMin(b) - m) || toMin(a) - toMin(b)).slice(0, k);
  return { best: by[0], list: by.sort() };
}

function evaluate() {
  const d = S.d, free = freeOf(S.day), t = S.time;
  let msg = '', cls = '', sugs = [];
  if (!t) {
    const nd = d.days.find(x => x.date > S.day && !x.closed && x.free.length);
    if (nd) { msg = 'ลอง' + dRel(nd.date, d.now.date); sugs = nd.free.slice(0, 3).map(x => ({ d: nd.date, t: x })); }
  } else if (free.indexOf(t) >= 0) {
    S.pick = t; msg = '<i class="ti ti-check"></i> เวลานี้ว่าง'; cls = 'ok';
    const x = boostOf(S.day, t);
    if (x > 1) msg += ` · <span class="au"><i class="ti ti-bolt"></i> แต้ม ×${x}</span>`;
  } else {
    const m = toMin(t);
    cls = 'warn';
    if (free.length) {
      const n = nearest(free, m, 3);
      if (!S.pick || free.indexOf(S.pick) < 0) S.pick = n.best;
      msg = 'เวลานี้มีคิวแล้ว · ใกล้ที่สุดที่ว่าง';
      sugs = n.list.map(x => ({ d: S.day, t: x }));
    } else {
      const nd = d.days.find(x => x.date > S.day && !x.closed && x.free.length);
      msg = 'วันนี้คิวเต็มแล้ว';
      if (nd) {
        msg += ' · ลอง' + dRel(nd.date, d.now.date);
        sugs = nearest(nd.free, m, 3).list.map(x => ({ d: nd.date, t: x }));
      }
    }
  }
  const anyFree = d.days.some(x => !x.closed && x.free.length);
  if (!anyFree) {
    cls = 'warn'; sugs = [];
    msg = `คิวเต็มทุกวันที่เปิดจองแล้ว${d.phone ? ` · <a href="tel:${esc(d.phone)}" class="au" style="text-decoration:underline"><i class="ti ti-phone"></i> โทรหาร้าน</a>` : ''}`;
  }
  const msgEl = $('#msg');
  msgEl.className = 'msg ' + cls;
  msgEl.innerHTML = msg;
  $('#sugs').innerHTML = sugs.map(s => `
    <button class="chip ${s.d === S.day && s.t === S.pick ? 'on' : ''}" data-d="${s.d}" data-t="${s.t}" style="font-size:18px">
      ${s.t}${s.d !== S.day ? `<small>${dRel(s.d, d.now.date)}</small>` : ''}
    </button>`).join('');
  $('#sugs').style.display = sugs.length ? '' : 'none';
  const ok = S.pick && free.indexOf(S.pick) >= 0;
  $('#go').textContent = ok ? (S.resched ? 'เลื่อนเป็น ' : 'จองเวลา ') + S.pick : (S.resched ? 'เลื่อนคิว' : 'จองคิว');
  $('#go').style.display = anyFree ? '' : 'none';
  $('#ego').textContent = '';
}

async function submit() {
  const go = $('#go');
  if (!S.pick || freeOf(S.day).indexOf(S.pick) < 0) { $('#ego').textContent = 'เลือกเวลาก่อน'; return; }
  let name = '', phone = '';
  if (!S.resched) {
    if ($('#nm')) {
      name = $('#nm').value.trim(); phone = $('#ph').value.replace(/\D/g, '');
      let bad = false;
      if (!name) { $('#enm').textContent = 'ใส่ชื่อก่อน'; bad = true; }
      if (!/^0\d{8,9}$/.test(phone)) { $('#eph').textContent = 'ใส่เบอร์โทร 10 หลัก'; bad = true; }
      if (bad) return;
      if (!S.forOther) store.set('k10_me', { name, phone });
    } else {
      const me = store.get('k10_me', {});
      name = me.name; phone = me.phone;
    }
  }
  go.classList.add('busy');
  let res;
  try {
    const referrer = $('#rf') ? $('#rf').value.replace(/\D/g, '') : '';
    const note = $('#nt') ? $('#nt').value.trim() : '';
    res = await call('book', { date: S.day, time: S.pick, name, phone, referrer, note, token: S.resched ? S.resched.token : '' });
  } catch (e) {
    go.classList.remove('busy');
    $('#ego').textContent = 'ส่งไม่สำเร็จ · ลองใหม่อีกครั้ง';
    return;
  }
  go.classList.remove('busy');
  if (res.ok) {
    const toks = store.get('k10_tickets', []);
    if (toks.indexOf(res.booking.token) < 0) toks.push(res.booking.token);
    store.set('k10_tickets', toks);
    S.time = ''; S.pick = null;
    await load();
    const wasOther = S.forOther;
    S.forOther = false;
    showTickets(res.booking.token);
    toast(S.resched ? 'เลื่อนคิวแล้ว' : wasOther ? 'จองให้แล้ว' : 'จองแล้ว');
    return;
  }
  if (res.code === 'TAKEN') {
    S.d.days = res.days; S.pick = null; evaluate();
    $('#ego').textContent = res.msg;
  } else if (res.code === 'REF') {
    $('#refbox').open = true; $('#erf').textContent = res.msg;
  } else if (res.code === 'PHONE' || res.code === 'DUP' || res.code === 'NAME') {
    if (!$('#nm')) renderWho(true);
    const msg = res.code === 'DUP' ? `เบอร์นี้จองไว้แล้ว ${res.date ? dShort(res.date) + ' ' + res.time : ''} · เลื่อนหรือยกเลิกได้จากลิงก์ตั๋วเดิม${S.d.phone ? ' หรือโทรหาร้าน' : ''}` : res.msg;
    $(res.code === 'NAME' ? '#enm' : '#eph').textContent = msg;
  } else {
    $('#ego').textContent = res.msg;
  }
}

/*** ---------- ตั๋ว ---------- ***/
function showTickets(focus) {
  S.mode = 'ticket'; S.resched = null; S.forOther = false;
  const d = S.d;
  if (!d.tickets.length) return showBook();
  $('#app').innerHTML = shopNoteHtml() + noticeHtml() + d.tickets.map(t => `
    <div class="card" style="margin-bottom:16px${focus && focus !== t.token ? ';opacity:.75' : ''}">
      <div class="tk-top">
        <i class="ti ti-scissors au" style="font-size:20px"></i>
        <div class="sv" style="font-size:19px;margin-top:6px">${esc(d.shop)}</div>
        <div class="sv au tk-time">${esc(t.time)}</div>
        <div class="mu">${dLong(t.date)}</div>
        <div style="margin-top:12px">${esc(t.name)}</div>
        ${t.moved ? `<div class="badge" style="margin-top:10px;border-color:var(--gold);color:var(--gold);white-space:normal"><i class="ti ti-arrows-exchange"></i> ร้านเลื่อนคิวให้ · เดิม ${dShort(t.moved.slice(0, 10))} ${esc(t.moved.slice(11))}</div>` : ''}
        ${t.note ? `<div class="mu" style="margin-top:4px"><i class="ti ti-message-dots"></i> ${esc(t.note)}</div>` : ''}
      </div>
      <div class="tk-bar">
        ${d.mapUrl ? `<a href="${esc(d.mapUrl)}" target="_blank"><i class="ti ti-map-pin"></i><small>แผนที่</small></a>` : ''}
        ${d.phone ? `<a href="tel:${esc(d.phone)}"><i class="ti ti-phone"></i><small>โทร</small></a>` : ''}
        <button data-a="link" data-k="${t.token}"><i class="ti ti-link"></i><small>เก็บลิงก์</small></button>
        <button data-a="move" data-k="${t.token}"><i class="ti ti-pencil"></i><small>เลื่อน</small></button>
        <button data-a="cancel" data-k="${t.token}" class="warn"><i class="ti ti-x"></i><small>ยกเลิก</small></button>
      </div>
    </div>`).join('') + `
    <div class="mu" style="text-align:center;margin:4px 0 18px">เปิดหน้านี้อีกครั้งเพื่อเลื่อนหรือยกเลิก · กด "เก็บลิงก์" ไว้เปิดจากเครื่องอื่น</div>
    ${a2hsHtml(true)}
    <button class="btn line" data-a="new"><i class="ti ti-plus"></i> จองคิวให้อีกคน</button>
    <button class="link" data-a="mem" style="margin-top:6px"><i class="ti ti-id-badge-2"></i> บัตรสมาชิก · ดูแต้ม</button>`;
  $('#app').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const t = d.tickets.find(x => x.token === b.dataset.k);
    if (b.dataset.a === 'new') return showBook(null, true);
    if (b.dataset.a === 'mem') return showMember();
    if (b.dataset.a === 'link') return copyText(d.url + '?t=' + t.token);
    if (b.dataset.a === 'move') {
      $('#app').innerHTML = '<div class="load"><i class="ti ti-scissors"></i></div>';
      if (!await load(t.token)) return;
      S.day = t.date; S.time = ''; S.pick = null;
      return showBook(t);
    }
    if (b.dataset.a === 'cancel') {
      askConfirm(`ยกเลิกคิว ${dShort(t.date)} ${t.time}?`, 'ยกเลิกคิว', async () => {
        try {
          await call('cancelBooking', t.token);
          store.set('k10_tickets', store.get('k10_tickets', []).filter(x => x !== t.token));   // ยกเลิกเอง ไม่ต้องแจ้งว่าร้านยกเลิก
          await load();
          toast('ยกเลิกแล้ว');
          S.d.tickets.length ? showTickets() : showBook();
        } catch (err) { toast('ยกเลิกไม่สำเร็จ'); }
      });
    }
  };
}

/*** ---------- บัตรสมาชิก ---------- ***/
const MONTHS_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function birthHtml(m, bonus) {
  if (m.birthMonth) return `<div class="mu" style="margin-top:10px"><i class="ti ti-cake"></i> เดือนเกิด ${MONTHS_TH[m.birthMonth - 1]}${bonus ? ` · มาตัดในเดือนนี้รับ +${bonus} แต้ม` : ''}</div>`;
  if (!bonus) return '';   // ร้านปิดโบนัสเดือนเกิดอยู่
  return `<div class="mu" style="margin:14px 0 8px"><i class="ti ti-cake"></i> เลือกเดือนเกิด${bonus ? ` รับ +${bonus} แต้มเมื่อมาตัดในเดือนเกิด` : ''} (เลือกได้ครั้งเดียว)</div>
    <div class="chips" style="grid-template-columns:repeat(6,1fr);gap:6px">${MONTHS_TH.map((n, i) => `<button class="chip" data-bm="${i + 1}" style="font-size:12px;padding:7px 0">${n}</button>`).join('')}</div>`;
}
function showMember() {
  S.mode = 'member';
  const me = store.get('k10_me', {}), back = S.d.tickets.length ? showTickets : showBook;
  $('#app').onclick = null;
  $('#app').innerHTML = `
    <div class="head"><span class="sv brand">${esc(S.d.shop)}</span><span class="mu">สมาชิก</span></div>
    <div class="field"><i class="ti ti-phone"></i><input id="mp" placeholder="เบอร์โทรที่ใช้จอง" inputmode="tel" maxlength="12" value="${esc(me.phone || store.get('k10_mphone', ''))}">
      <button id="mgo" class="au" style="font-size:20px;padding:6px" aria-label="ดูแต้ม"><i class="ti ti-arrow-right"></i></button></div>
    <div class="err" id="merr"></div>
    <div id="mcard" style="margin-top:18px"></div>
    ${a2hsHtml(false).replace('margin-bottom:14px', 'margin:18px 0 0')}
    ${S.d.terms ? '<button class="btn line" id="mterms" style="margin-top:18px;color:var(--gold);border-color:var(--gold-line)"><i class="ti ti-file-description"></i> ดูเงื่อนไขสมาชิกและรางวัล</button>' : ''}
    <button class="link" id="mback" style="margin-top:10px">กลับ</button>`;
  if ($('#mterms')) $('#mterms').onclick = () => openSheet(termsHtml(S.d.terms));
  const go = async () => {
    const ph = $('#mp').value.replace(/\D/g, '');
    $('#merr').textContent = '';
    if (!/^0\d{8,9}$/.test(ph)) { $('#merr').textContent = 'ใส่เบอร์โทร 10 หลัก'; return; }
    $('#mcard').innerHTML = '<div class="load" style="padding:30px 0"><i class="ti ti-scissors"></i></div>';
    let r;
    try { r = await call('getMember', ph); } catch (e) { $('#mcard').innerHTML = ''; $('#merr').textContent = 'โหลดไม่สำเร็จ · ลองใหม่'; return; }
    if (!r.ok) { $('#mcard').innerHTML = ''; $('#merr').textContent = r.msg; return; }
    store.set('k10_mphone', ph);
    const m = r.member;
    $('#mcard').innerHTML = (r.isNew
      ? `<div class="card" style="padding:22px 18px;text-align:center"><i class="ti ti-scissors au" style="font-size:22px"></i>
          <div style="margin-top:8px">ยังไม่มีแต้ม</div><div class="mu">มาตัดครั้งแรก รับ +${m.tier.earn} แต้ม · สมัครให้อัตโนมัติด้วยเบอร์นี้</div></div>`
      : memberCard(m) + birthHtml(m, r.birthdayBonus)) +
      (r.rewards.length ? `<div class="mu" style="margin:18px 0 8px"><i class="ti ti-gift"></i> รางวัล</div>${rewardList(r.rewards, m.points, false)}
        <div class="mu" style="text-align:center;margin-top:8px">แลกที่ร้าน · แจ้งช่างตอนมาตัด</div>` : '');
  };
  $('#mgo').onclick = go;
  $('#mcard').onclick = async e => {
    const b = e.target.closest('[data-bm]'); if (!b) return;
    const r = await call('setBirthMonth', $('#mp').value, +b.dataset.bm).catch(() => null);
    if (!r) return toast('บันทึกไม่สำเร็จ');
    if (!r.ok) return toast(r.msg);
    toast('บันทึกเดือนเกิดแล้ว'); go();
  };
  $('#mp').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#mback').onclick = () => back();
  if ($('#mp').value) go();
}

/*** ---------- เพิ่มไอคอนร้านลงหน้าจอโฮม ---------- ***/
let installEvt = null;   // Android Chrome: เก็บไว้ให้กดติดตั้งตอนลูกค้าแตะปุ่ม
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { installEvt = null; document.querySelectorAll('.a2hs').forEach(el => el.remove()); toast('เพิ่มไอคอนแล้ว'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isInApp = () => /Line\/|FBAN|FBAV|FB_IAB|Instagram|TikTok|Messenger/i.test(navigator.userAgent);

// closable = ใต้ตั๋ว (กด ✕ แล้วไม่ขึ้นอีก) · หน้าสมาชิกแสดงเสมอ
function a2hsHtml(closable) {
  if (isStandalone() || (closable && store.get('k10_a2hs_x', 0))) return '';
  return `<div class="a2hs" role="button" tabindex="0" data-hs="1"><span class="ic"><i class="ti ti-scissors"></i></span>
    <span style="flex:1">เพิ่มไอคอนร้านลงหน้าจอ<span class="mu" style="display:block">ครั้งหน้ากดจองได้ทันที</span></span>
    ${closable ? '<button class="x" data-hsx="1" aria-label="ไม่ต้องแสดงอีก"><i class="ti ti-x"></i></button>' : '<i class="ti ti-chevron-right mu"></i>'}</div>`;
}
document.addEventListener('click', async e => {
  if (e.target.closest('[data-hsx]')) { store.set('k10_a2hs_x', 1); e.target.closest('.a2hs').remove(); e.stopPropagation(); return; }
  if (!e.target.closest('[data-hs]')) return;
  e.stopPropagation();
  const step = (n, t) => `<div class="hs-st"><span class="hs-n">${n}</span><span>${t}</span></div>`;
  if (isInApp()) return openSheet(`<h3>เปิดในเบราว์เซอร์ก่อน</h3>
    <div class="mu" style="margin-bottom:6px">แอป LINE / Facebook เพิ่มไอคอนลงหน้าจอไม่ได้</div>
    ${step(1, 'แตะ <b>⋯</b> หรือ <i class="ti ti-share-2 au"></i> มุมขวาบน')}
    ${step(2, `แตะ <b>"เปิดในเบราว์เซอร์"</b> (${isIOS() ? 'Safari' : 'Chrome'})`)}
    ${step(3, 'กดปุ่ม "เพิ่มไอคอนร้านลงหน้าจอ" อีกครั้ง')}
    <button class="btn" data-a="cp" style="margin-top:14px"><i class="ti ti-copy"></i> คัดลอกลิงก์ (ไปวางในเบราว์เซอร์เองก็ได้)</button>`,
    a => { if (a === 'cp') copyText(location.origin + location.pathname); });
  if (installEvt) {
    installEvt.prompt();
    const r = await installEvt.userChoice.catch(() => null);
    if (r && r.outcome === 'accepted') installEvt = null;
    return;
  }
  if (isIOS()) return openSheet(`<h3>เพิ่มลงหน้าจอโฮม</h3>
    ${step(1, `แตะปุ่มแชร์ <i class="ti ti-share-2 au" style="font-size:20px"></i> ${/CriOS|FxiOS/.test(navigator.userAgent) ? 'มุมขวาบน' : 'ด้านล่างจอ'}`)}
    ${step(2, 'เลื่อนลง แตะ <b>"เพิ่มไปยังหน้าจอโฮม"</b> <i class="ti ti-square-plus au" style="font-size:20px"></i>')}
    ${step(3, 'แตะ <b>"เพิ่ม"</b> มุมขวาบน')}
    <div class="mu" style="margin-top:12px">iPhone ไม่ยอมให้หน้าเว็บติดตั้งเอง ต้องกดตามนี้ · ไอคอนชื่อ "จองคิว ๑๐ กันยา"</div>
    <button class="btn" data-a="ok" style="margin-top:16px">เข้าใจแล้ว</button>`, () => closeSheet());
  // Android ที่ Chrome ยังไม่พร้อมให้กดติดตั้ง (หรือใช้เบราว์เซอร์อื่น)
  openSheet(`<h3>เพิ่มลงหน้าจอหลัก</h3>
    ${step(1, 'แตะ <b>⋮</b> มุมขวาบนของเบราว์เซอร์')}
    ${step(2, 'แตะ <b>"เพิ่มลงในหน้าจอหลัก"</b> หรือ <b>"ติดตั้งแอป"</b>')}
    ${step(3, 'แตะ <b>"เพิ่ม"</b> / <b>"ติดตั้ง"</b>')}
    <button class="btn" data-a="ok" style="margin-top:16px">เข้าใจแล้ว</button>`, () => closeSheet());
}, true);

/*** ---------- ปุ่มย้อนกลับของมือถือ ---------- ***/
// หน้าต่าง → บัตรสมาชิก → หน้าจอง (ถ้ามีตั๋วอยู่ กลับไปหน้าตั๋ว)
window.appBack = {
  need: () => !!$('.shade') || S.mode === 'member' || (S.mode === 'book' && !!S.d && (!!S.resched || S.d.tickets.length > 0)),
  handle: () => {
    if ($('.shade')) return popSheet();
    if (S.mode === 'member') return S.d.tickets.length ? showTickets() : showBook();
    if (S.mode === 'book' && S.resched) return load().then(ok => ok && showTickets());
    if (S.mode === 'book' && S.d.tickets.length) return showTickets();
  }
};

start();
</script>
</body>
</html>
