async function pushAction(a, b) {
  b.classList.add('busy');
  try {
    if (a === 'pushOn') {
      const reg = await navigator.serviceWorker.register('sw.js');
      await navigator.serviceWorker.ready;
      if (await Notification.requestPermission() !== 'granted') { toast('ไม่ได้รับอนุญาต'); return renderPush(); }
      const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), ch => ch.charCodeAt(0));
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      saveSessForSw(B.sess);
      const r = await api('barberPushSub', sub.endpoint, (isIOS() ? 'iPhone' : 'มือถือ') + ' ' + new Date().toLocaleDateString('th-TH'));
      if (!r.ok) { await sub.unsubscribe(); toast(r.msg); } else toast('เปิดการแจ้งเตือนแล้ว');
    }
    if (a === 'pushOff') {
      const sub = await pushSub();
      if (sub) { await api('barberPushUnsub', sub.endpoint).catch(() => {}); await sub.unsubscribe(); }
      toast('ปิดการแจ้งเตือนแล้ว');
    }
    if (a === 'pushTest') {
      const r = await api('barberPushTest');
      toast(r.total ? `ส่งแล้ว ${r.sent}/${r.total} เครื่อง · รอสักครู่` : 'ยังไม่มีเครื่องที่เปิดการแจ้งเตือน');
    }
    if (a === 'pushTestLater') {
      toast('จะส่งใน 10 วินาที · ปิดแอปหรือล็อกจอได้เลย');
      await api('barberPushTest', 10).catch(() => {});
    }
  } catch (e) {
    toast('ทำไม่สำเร็จ · ' + (e && e.message || e));
  } finally {
    b.classList.remove('busy');
    renderPush();
  }
}

  mem: ['สมาชิก', 'ดูแต้ม แลกรางวัล ปรับแต้ม'],
  sum: ['สรุป', 'จำนวนลูกค้า รายได้ และช่วงเวลาที่คนเยอะ'],
  set: ['ตั้งค่า', 'เวลาเปิดปิด ช่วงพัก ราคา รับเงิน ประกาศ แต้ม รางวัล QR และคู่มือ']
};
(function bindNavTips() {
  let timer = null, shown = false;
  const nav = $('#nav');
  const hide = () => { const t = $('.tipbox'); if (t) t.remove(); };
  nav.addEventListener('contextmenu', e => e.preventDefault());
  nav.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    shown = false;
    timer = setTimeout(() => {
      const tip = NAV_TIPS[b.dataset.v]; if (!tip) return;
      shown = true;
      hide();
      const r = b.getBoundingClientRect(), el = document.createElement('div');
      el.className = 'tipbox';
      el.innerHTML = `<b>${esc(tip[0])}</b>${esc(tip[1])}`;
      if (isTabL()) Object.assign(el.style, { left: (r.right + 12) + 'px', top: r.top + 'px', bottom: 'auto', transform: 'none' });
      else el.style.left = Math.min(Math.max(r.left + r.width / 2, 125), innerWidth - 125) + 'px';
      document.body.appendChild(el);
      if (navigator.vibrate) navigator.vibrate(15);
    }, 450);
  });
  const end = () => { clearTimeout(timer); if (shown) setTimeout(hide, 1600); };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);
  nav.addEventListener('pointerleave', end);
  // กดค้างแล้วปล่อย = ดูคำอธิบายอย่างเดียว ไม่กดปุ่ม
  nav.addEventListener('click', e => { if (shown) { e.stopImmediatePropagation(); e.preventDefault(); shown = false; } }, true);
})();

/*** ---------- แท็บเล็ต: จัดหน้าตามขนาด/แนวจอ ---------- ***/
// '' = มือถือ · 'p' = แท็บเล็ตแนวตั้ง (กว้าง ≥ 700) · 'l' = แท็บเล็ตแนวนอน (กว้าง ≥ 900 และกว้างกว่าสูง)
const layoutMode = () => innerWidth >= 900 && innerWidth > innerHeight ? 'l' : innerWidth >= 700 ? 'p' : '';
let LM = '';
const isTabL = () => LM === 'l';
function applyLayout() {
  const m = layoutMode();
  if (m === LM) return false;
  LM = m;
  document.body.classList.toggle('tab-l', m === 'l');
  document.body.classList.toggle('tab-p', m === 'p');
  return true;
}
applyLayout();
let lmT;
addEventListener('resize', () => {
  clearTimeout(lmT);
  lmT = setTimeout(() => {
    if (!applyLayout() || !B.sess || drag) return;
    if (B.view === 'list' && B.d) renderList();
    else if (B.view === 'set' && B.set) renderSettings();
    else if (B.view === 'mem') showMembers($('#mq') ? $('#mq').value : '');
    else if (B.view === 'sum' && B.sum) renderSummary();
  }, 150);
});

/*** ---------- ปุ่มย้อนกลับของมือถือ ---------- ***/
window.appBack = {
  need: () => !!B.sess && (!!$('.shade') || B.view !== 'list'),
  handle: () => {
    if ($('.shade')) return popSheet();
    if (B.view === 'set' && B.setPage && !isTabL()) return leaveSetPage();
    if (B.view === 'set' && setDirty()) return askConfirm('ยังไม่ได้บันทึก · ออกโดยไม่บันทึก?', 'ออก ไม่บันทึก', () => { B.view = 'list'; renderList(); }, 'อยู่ต่อ');
    if (B.view !== 'list' && B.d) { B.view = 'list'; renderList(); loadDay(B.date).catch(() => {}); }
  }
};

/*** ---------- แถบล่าง ---------- ***/
function navOn(v) {
  if (v !== 'list') $('#app').className = 'wrap'; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
$('#nav').addEventListener('click', async e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  const v = b.dataset.v;
  if (v === 'list') { B.view = 'list'; navOn('list'); return B.d ? (renderList(), loadDay(B.date).catch(() => {})) : boot(); }
  if (v === 'set') return showSettings('');
  if (v === 'mem') return showMembers();
  if (v === 'add') { if (B.view !== 'list') { B.view = 'list'; renderList(); } return addSheet(''); }
  if (v === 'sum') return showSummary();
});

boot();
</script>
</body>
