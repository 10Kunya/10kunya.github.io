<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>๑๐ กันยา · ช่าง</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="๑๐ กันยา">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme: dark;
  --bg:#141210; --card:#1B1815; --gold-bg:#1E1A15;
  --line:#221F1B; --line2:#2E2925; --gold-line:#6B5A3E;
  --text:#F3EEE6; --mute:#A79E91; --dim:#6A6359;
  --gold:#C9A66B; --warn:#C49384; --ok:#9DB58A;
  --c-noshow:#D9705A;   /* ไม่มา = แดงอิฐ (ร้ายแรงสุด) */
  --c-move:#E0954A;     /* เลื่อนบ่อย = ส้มอำพัน (ระวัง) */
  --c-note:#8FB0CC;     /* ข้อความลูกค้า = ฟ้าหม่น (ข้อมูล) */
  --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
  --serif:'Cormorant Garamond','Noto Serif Thai',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:440px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom))}
.sv{font-family:var(--serif);font-variant-numeric:lining-nums tabular-nums;font-weight:500}
.mu{color:var(--mute);font-size:13px}
.au{color:var(--gold)}
.ti{vertical-align:-2px}

.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.brand{font-size:24px;letter-spacing:.5px}

.chips{display:grid;gap:8px}
.chip{border:1px solid var(--line2);border-radius:10px;padding:9px 0;text-align:center;transition:border-color .15s,background .15s}
.chip.on{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.chip.off{color:var(--dim);border-style:dashed;cursor:default}
.chip small{display:block;color:var(--mute);font-size:12px}
.chip.on small{color:var(--gold)}

.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.field{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2);padding:4px 0}
.field i{color:var(--mute);font-size:18px}
.field input{flex:1;background:transparent;border:0;outline:0;padding:10px 0;font-size:16px}
.field input::placeholder{color:var(--dim)}
.field:focus-within{border-color:var(--gold-line)}
.err{color:var(--warn);font-size:13px;min-height:0;margin-top:4px}
.err:empty{display:none}

.btn{display:block;width:100%;background:var(--gold);color:var(--bg);border-radius:12px;padding:14px;text-align:center;font-weight:500;font-size:16px}
.btn:active{transform:scale(.98)}
.btn.line{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.busy{opacity:.6;pointer-events:none}
.link{color:var(--mute);font-size:14px;text-align:center;display:block;width:100%;padding:12px}

.card{border:1px solid var(--gold-line);border-radius:14px}
.ring{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:21px;flex-shrink:0}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nav div{max-width:440px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{font-size:23px;color:var(--dim);padding:6px 16px}
.nav button.on{color:var(--gold)}

.shade{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);background:rgba(8,7,6,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.shade.under{display:none}
.sheet{position:relative;background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:26px 20px calc(22px + env(safe-area-inset-bottom));max-height:88%;overflow:auto;overscroll-behavior:contain;animation:up .2s ease-out}
.grab{position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line2)}
.sx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;color:var(--mute);font-size:20px;display:flex;align-items:center;justify-content:center;z-index:1}
.sheet h3{padding-right:36px}
@media (min-width:700px){
  .shade{align-items:center;padding:24px}
  .sheet{border-radius:20px;border-bottom:1px solid var(--line2);max-width:520px;max-height:85%;padding:28px 26px 24px;animation:pop .18s ease-out}
  .grab{display:none}
}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sheet h3{margin:0 0 14px;font-weight:500;font-size:20px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
.act i{font-size:20px;color:var(--mute);width:22px}
.act.gold i,.act.gold{color:var(--gold)}
.act.warn i,.act.warn{color:var(--warn)}
.act:last-child{border-bottom:0}

.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:20px;padding:2px 10px;font-size:12px;white-space:nowrap}
.bar{height:4px;background:var(--line2);border-radius:2px;margin:6px 0 4px;overflow:hidden}
.bar div{height:100%;background:var(--gold);border-radius:2px}
.rw{border:1px solid var(--line2);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px;width:100%;text-align:left}
.rw i{font-size:18px}
.rw.dim{opacity:.5}
.rw.can{border-color:var(--gold-line)}

.tm-t{font-size:20px;margin-bottom:2px;padding-right:36px}
.tm-h{color:var(--gold);font-size:14px;margin:18px 0 6px}
.tm-r{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tm-n{min-width:84px;text-align:right;font-family:var(--serif);font-variant-numeric:lining-nums;font-size:17px}
.tm ul{margin:0;padding-left:20px;line-height:1.8}
/* เปิดให้ลูกค้าดูบนจอช่าง: เต็มจอ ตัวใหญ่ */
.shade.full{padding:0;align-items:stretch}
.shade.full .sheet{max-width:none;max-height:none;height:100%;border-radius:0;border:0;padding:calc(30px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
.shade.full .tm{max-width:640px;margin:0 auto;font-size:19px}
.shade.full .tm-t{font-size:28px}
.shade.full .tm .mu{font-size:16px}
.shade.full .tm-h{font-size:18px;margin-top:24px}
.shade.full .tm-r{padding:12px 0}
.shade.full .tm-n{font-size:22px;min-width:110px}
.shade.full .sx{top:calc(14px + env(safe-area-inset-top));font-size:26px;width:48px;height:48px}
.itip{position:fixed;z-index:60;background:var(--text);color:var(--bg);border-radius:10px;padding:7px 12px;font-size:14px;line-height:1.4;max-width:220px;text-align:center;
  pointer-events:none;transform:translate(-50%,-100%);animation:fade .12s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.itip.below{transform:translate(-50%,0)}
button[aria-label],a[aria-label]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.dfield{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer;font-variant-numeric:lining-nums}
.dfield .ti{color:var(--mute);font-size:18px}
.dfield .ph{color:var(--dim)}
.dfield input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
.dfield:focus-within{border-color:var(--gold-line)}
.toast.top{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
.sbody > .card:first-child{margin-top:26px}   /* 3) ไม่ให้ปุ่ม ✕ ทับการ์ด */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:14px;z-index:30;animation:fade .15s;white-space:nowrap}
.load{display:flex;justify-content:center;padding:80px 0;color:var(--dim);font-size:26px}
.load i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
</style>

<style>
.now-label{font-size:15px}
.now-time{font-size:52px;line-height:1}
.now-row{display:flex;align-items:center;gap:10px;margin-top:6px}
.now-name{display:block;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-ring{width:50px;height:50px;font-size:24px}
.nextline{display:none}
.md{display:block}
.md-r{display:none}
/* แท็บเล็ตแนวตั้ง: เต็มความกว้าง ตัวใหญ่ขึ้น */
body.tab-p .wrap{max-width:900px;padding-left:28px;padding-right:28px}
body.tab-p .nav div{max-width:900px}
body.tab-p .set,body.tab-p .memwrap{max-width:640px;margin:0 auto}
body.tab-p .now-time{font-size:76px}
body.tab-p .now-name{font-size:30px}
body.tab-p .now-label{font-size:18px}
body.tab-p .now-ring{width:72px;height:72px;font-size:34px}
body.tab-p .nstat{font-size:28px;min-width:110px}
body.tab-p .cell{font-size:22px;border-radius:12px;padding:0 14px;gap:12px}
body.tab-p .cell .t{font-size:28px;width:80px}
body.tab-p .grid{gap:8px}
body.tab-p #app.fit .brand,body.tab-l #app.fit .brand{font-size:26px}
body.tab-p .dnav button,body.tab-l .dnav button{font-size:24px}
body.tab-p .nowb .badge,body.tab-l .nowb .badge{font-size:15px;padding:3px 12px}
body.tab-p .cell .ti,body.tab-l .cell .ti{font-size:18px !important}
/* แท็บเล็ตแนวนอน: ซ้าย = คิวตอนนี้, ขวา = ตารางทั้งวัน, เมนูเป็นแถบแนวตั้งด้านซ้าย */
body.tab-l .wrap{max-width:none;padding:calc(18px + env(safe-area-inset-top)) 28px 18px calc(96px + env(safe-area-inset-left))}
body.tab-l #app.fit{height:100dvh;display:grid;grid-template-columns:minmax(320px,38%) 1fr;grid-template-rows:auto 1fr;column-gap:28px;padding-bottom:18px}
body.tab-l #app.fit > .head{grid-column:1;grid-row:1}
body.tab-l #app.fit > .nowb{grid-column:1;grid-row:2;flex-direction:column;justify-content:center;margin:0;padding:24px}
body.tab-l #app.fit > .grid{grid-column:2;grid-row:1 / 3;gap:8px}
body.tab-l .nowb > div:first-child{display:flex;flex-direction:column;justify-content:center}
body.tab-l .nstat{border-left:0;border-top:1px solid var(--line2);padding:16px 0 0;flex-direction:row;justify-content:space-around;font-size:30px}
body.tab-l .now-time{font-size:104px}
body.tab-l .now-name{font-size:36px}
body.tab-l .now-label{font-size:20px}
body.tab-l .now-row{margin-top:10px}
body.tab-l .now-ring{width:88px;height:88px;font-size:40px}
body.tab-l .nextline{display:block;font-size:18px;margin-top:18px}
body.tab-l .cell{font-size:22px;border-radius:12px;padding:0 16px;gap:14px}
body.tab-l .cell .t{font-size:28px;width:82px}
body.tab-l .nav{top:0;bottom:0;right:auto;width:76px;border-top:0;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 0 18px}
body.tab-l .nav div{flex-direction:column;justify-content:flex-start;align-items:center;gap:10px;height:100%}
body.tab-l .nav button{font-size:26px;padding:14px}
body.tab-l .md{display:grid;grid-template-columns:minmax(280px,36%) 1fr;gap:32px;align-items:start}
body.tab-l .md-r{display:block;position:sticky;top:18px;max-height:calc(100dvh - 36px);overflow:auto;border:1px solid var(--line2);border-radius:16px;padding:22px}
body.tab-l .md-empty{color:var(--dim);text-align:center;padding:60px 0}
body.tab-l .menu-it.sel{background:var(--gold-bg);border-radius:12px;padding-left:10px;padding-right:10px}
body.tab-l .row.sel{background:var(--gold-bg);border-radius:10px;padding-left:10px;padding-right:10px}
#app.fit{height:calc(100dvh - 62px - env(safe-area-inset-bottom));display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:10px}
.nowb{display:flex;align-items:stretch;gap:12px;padding:12px 14px;margin-bottom:10px;flex-shrink:0}
.nstat{border-left:1px solid var(--line2);padding-left:14px;display:flex;flex-direction:column;justify-content:space-around;font-size:21px;color:var(--mute);min-width:70px;font-variant-numeric:lining-nums}
.grid{flex:1;min-height:0;display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;gap:5px;touch-action:none}
.cell{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:9px;padding:0 9px;min-height:0;overflow:hidden;white-space:nowrap;font-size:16px;cursor:pointer;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s,opacity .12s}
.cell .t{font-family:var(--serif);font-variant-numeric:lining-nums;font-weight:500;font-size:19px;width:50px;flex-shrink:0}
.cell .n{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.k-booked{border-color:#3E372F}
.cell.k-free,.cell.k-cont{border-style:dashed;border-color:#3A332C;color:#7A7268}
.cell.k-cont{border-color:transparent}
.cell.k-block,.cell.k-brk{color:var(--dim);background:#181512}
.cell.k-brk{border-color:#221F1B}
.wk{gap:8px !important}
.wk .d{width:38px;flex:none !important}
.wk select{font-size:20px !important}
.wk.off .d{color:var(--dim)}
.cell.k-done{color:var(--mute)}
.cell.k-done .t{text-decoration:line-through}
.cell.k-noshow{color:var(--mute)}
.cell.k-noshow .n{text-decoration:line-through}
.cell.past{opacity:.38}
.cell.late{opacity:1}
.cell.late .t{color:var(--warn)}
.cell.cur{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.cell.lift{opacity:.3}
.cell.drop{border:1.5px solid var(--gold);background:var(--gold-bg);color:var(--gold)}
.grid.dragging .cell.k-free:not(.past){border-color:var(--gold-line)}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;background:var(--gold);color:var(--bg);border-radius:10px;padding:8px 14px;font-size:16px;white-space:nowrap}
.newbk{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:35;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--gold);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:16px;line-height:1.4;max-width:420px;margin:0 auto;animation:up .2s ease-out}
.newbk > .ti:first-child{font-size:26px}
.newbk.k-move{background:var(--c-move)}
.newbk.k-cancel{background:var(--c-noshow)}
.newbk.k-edit{background:var(--c-note)}
.cell.k-xcancel{border:1px dashed var(--c-noshow);color:var(--mute)}
.cell.k-xcancel .n{text-decoration:line-through;color:var(--c-noshow);opacity:.75}
.dnav{display:flex;align-items:center;gap:4px}
.dnav button{color:var(--mute);font-size:20px;padding:8px 8px;min-height:40px}
.dnav .dpick{border:1px solid var(--gold-line);border-radius:10px;padding:5px 11px;min-height:38px;font-size:16px;color:var(--gold);white-space:nowrap}
.dnav .dpick .ti{font-size:16px;margin-right:3px}
.dnav .back{font-size:13px;padding:6px 4px;color:var(--mute);white-space:nowrap}
@media (max-width:360px){ #app.fit .head .brand{display:none} .dnav .back .bt{display:none} .dnav .back{font-size:18px} }
body.tab-p .hm i{aspect-ratio:1.7}   /* 5) แท็บเล็ตแนวตั้ง: ช่องเตี้ยลง ตารางพอดีจอ */
.lgph{width:72px;height:72px;border-radius:50%;border:1px dashed var(--gold-line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;flex-shrink:0}
.crop{position:relative;margin:0 auto 6px;overflow:hidden;border-radius:12px;background:#0C0B0A;touch-action:none;cursor:grab}
.crop img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cmask{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px var(--gold)}
.cmask.circle{border-radius:50%;box-shadow:0 0 0 400px rgba(8,7,6,.62),inset 0 0 0 2px var(--gold)}
.cmask.square{border-radius:22%;box-shadow:0 0 0 400px rgba(8,7,6,.62),inset 0 0 0 2px var(--gold)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.calg .h{font-size:13px;color:var(--mute);padding:4px 0}
.calg button{border-radius:10px;padding:7px 0 4px;font-family:var(--serif);font-variant-numeric:lining-nums;font-size:20px;line-height:1.1;border:1px solid transparent}
.calg button small{display:block;font-family:var(--sans);font-size:11px;color:var(--gold);height:14px}
.calg .past{opacity:.55}
.calg .off{color:var(--dim)}
.calg .hol{color:var(--c-noshow)}
.calg .hol small{color:var(--c-noshow)}
.calg .today{border-color:var(--gold)}
.calg .sel{background:var(--gold);color:var(--bg);opacity:1}
.calg .sel small{color:var(--bg)}
details.fold > summary{padding:12px 0;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold[open] > summary .ti-chevron-down{transform:rotate(180deg)}
.man h4{margin:14px 0 6px;font-size:15px;font-weight:500;color:var(--gold)}
.man ul{margin:0;padding-left:18px;color:var(--text);font-size:14px;line-height:1.7}
.man li{margin-bottom:2px}
.man .ti{color:var(--gold)}
.tipbox{position:fixed;z-index:45;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45;max-width:230px;text-align:center;pointer-events:none;animation:fade .12s}
.tipbox b{display:block;font-size:15px}
.nav button{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.dots{display:flex;justify-content:center;gap:14px;min-height:14px}
.dots span{width:12px;height:12px;border-radius:50%;border:1px solid var(--gold-line)}
.dots span.on{background:var(--gold);border-color:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:270px;margin:0 auto}
.pad button{aspect-ratio:1;border:1px solid var(--line2);border-radius:50%;font-family:var(--serif);font-variant-numeric:lining-nums;font-size:28px}
.pad button:active{background:var(--gold-bg);border-color:var(--gold-line)}
.pad .ok{color:var(--gold);border-color:var(--gold-line);font-size:24px}
.pad .del{border:0;color:var(--mute);font-size:24px}
.stp{display:inline-flex;align-items:center;gap:2px}
.stp button{width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;color:var(--mute);font-size:16px}

<body>
<div class="wrap" id="app"><div class="load"><i class="ti ti-scissors"></i></div></div>
<div class="nav" id="nav" style="display:none"><div>
  <button data-v="list" aria-label="คิว"><i class="ti ti-list"></i></button>
  <button data-v="add" aria-label="เพิ่มคิว"><i class="ti ti-plus"></i></button>
  <button data-v="mem" aria-label="สมาชิก"><i class="ti ti-users"></i></button>
  <button data-v="sum" aria-label="สรุป"><i class="ti ti-chart-bar"></i></button>
  <button data-v="set" aria-label="ตั้งค่า"><i class="ti ti-adjustments-horizontal"></i></button>
</div></div>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toMin = t => { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); };
const toHM = m => ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);

const WD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const WD_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const MO = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const MO_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const ymd = ds => ds.split('-').map(Number);
const wday = ds => { const p = ymd(ds); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); };
const addDays = (ds, n) => { const p = ymd(ds); return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10); };
const dShort = ds => WD[wday(ds)] + ' ' + ymd(ds)[2] + ' ' + MO[ymd(ds)[1] - 1];
const dLong = ds => 'วัน' + WD_FULL[wday(ds)] + ' ' + ymd(ds)[2] + ' ' + MO_FULL[ymd(ds)[1] - 1];
function dRel(ds, today) {
  const n = Math.round((Date.parse(ds) - Date.parse(today)) / 864e5);
  return n === 0 ? 'วันนี้' : n === 1 ? 'พรุ่งนี้' : n === 2 ? 'มะรืน' : WD[wday(ds)];
}
function closedText(days) {
  if (!days || !days.length) return 'เปิดทุกวัน';
  return 'หยุดวัน' + days.slice().sort().map(d => WD_FULL[d]).join(' ');
}

// เรียก Apps Script แบบไม่ส่งคุกกี้ Google (กันปัญหามือถือที่ล็อกอินหลายบัญชี)
const API_URL = 'https://script.google.com/macros/s/AKfycbxikYAE-wSNLOwdfVX2vK9Em2K1RQ-oap9v9WsbMzxUCD0PcSSpfxBRWHtXtjoZhPW8/exec';
async function call(fn, ...args) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit' });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j.result;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let toastT;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.toggle('top', !!document.querySelector('.shade:not(.under)'));
  clearTimeout(toastT);
  toastT = setTimeout(() => el.remove(), 2400);
}

/*** ---------- ช่องวันที่: แสดงแบบ dd mmm yy (พ.ศ.) แต่ยังเปิดปฏิทินของเครื่องตอนแตะ ---------- ***/
const fmtD = ds => { if (!ds) return ''; const [y, m, d] = ymd(ds); return String(d).padStart(2, '0') + ' ' + MO[m - 1] + ' ' + String((y + 543) % 100).padStart(2, '0'); };
function dateField(id, value, min, ph, color) {
  return `<label class="dfield" style="color:${color || 'var(--text)'}"><i class="ti ti-calendar"></i><span class="dtext ${value ? '' : 'ph'}" data-ph="${esc(ph)}">${value ? fmtD(value) : esc(ph)}</span>
    <input type="date" id="${id}" value="${esc(value || '')}" ${min ? `min="${min}"` : ''}></label>`;
}
// แตะตรงไหนของช่องก็เปิดปฏิทิน (บางเบราว์เซอร์ไม่เปิดเองเมื่อแตะช่องวันที่ที่มองไม่เห็น)
document.addEventListener('click', e => {
  const f = e.target.closest && e.target.closest('.dfield'); if (!f) return;
  const i = f.querySelector('input');
  e.preventDefault();
  try { i.showPicker(); } catch (err) { i.focus(); }
});
document.addEventListener('input', e => {
  const f = e.target.closest && e.target.closest('.dfield'); if (!f) return;
  const t = f.querySelector('.dtext'), v = e.target.value;
  t.textContent = v ? fmtD(v) : t.dataset.ph; t.classList.toggle('ph', !v);
}, true);

/*** ---------- กดค้างที่ปุ่มไอคอน (ไม่มีตัวหนังสือ) = บอกว่าปุ่มนี้ทำอะไร ---------- ***/
(function iconTips() {
  let timer = null, shown = false, tgt = null, x0 = 0, y0 = 0;
  const iconOnly = el => { const t = el.innerText.trim(); return !t || /^[‹›−+×✕↩]$/.test(t); };
  const hide = () => document.querySelectorAll('.itip').forEach(t => t.remove());
  const show = el => {
    hide();
    const r = el.getBoundingClientRect(), tip = document.createElement('div');
    tip.className = 'itip';
    tip.textContent = el.getAttribute('aria-label');
    const below = r.top < 70;
    if (below) tip.classList.add('below');
    tip.style.left = Math.min(Math.max(r.left + r.width / 2, 120), innerWidth - 120) + 'px';
    tip.style.top = (below ? r.bottom + 8 : r.top - 8) + 'px';
    document.body.appendChild(tip);
    if (navigator.vibrate) navigator.vibrate(15);
  };
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('button[aria-label],a[aria-label],[role=button][aria-label]');
    shown = false; tgt = null;
    if (!el || el.closest('#nav') || !iconOnly(el)) return;   // แถบล่างของช่างมีคำอธิบายแบบยาวอยู่แล้ว
    tgt = el; x0 = e.clientX; y0 = e.clientY;
    timer = setTimeout(() => { shown = true; show(el); }, 450);
  }, true);
  document.addEventListener('pointermove', e => { if (timer && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) { clearTimeout(timer); timer = null; } }, true);
  const end = () => { clearTimeout(timer); timer = null; if (shown) setTimeout(hide, 1500); };
  ['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, end, true));
  document.addEventListener('contextmenu', e => { if (e.target.closest('button[aria-label],a[aria-label]')) e.preventDefault(); }, true);
  // กดค้างแล้วปล่อย = ดูคำอธิบายอย่างเดียว ไม่กดปุ่ม
  document.addEventListener('click', e => { if (shown && tgt && tgt.contains(e.target)) { e.preventDefault(); e.stopImmediatePropagation(); shown = false; } }, true);
})();

/*** ---------- หน้าต่างเด้งจากล่าง ---------- ***/
// ปิดได้ 4 ทาง: ปุ่ม ✕ · แตะพื้นหลัง · ปัดลง · ปุ่มย้อนกลับของมือถือ
function makeShade(html, onClick) {
  const sh = document.createElement('div');
  sh.className = 'shade';
  sh.innerHTML = '<div class="sheet"><div class="grab"></div><button class="sx" data-close aria-label="ปิดหน้าต่าง"><i class="ti ti-x"></i></button><div class="sbody">' + html + '</div></div>';
  sh.addEventListener('click', e => {
    if (e.target === sh || e.target.closest('[data-close]')) return popSheet();
    const b = e.target.closest('[data-a]');
    if (b && onClick) onClick(b.dataset.a, b, sh);
  });
  swipeToClose($('.sheet', sh));
  return sh;
}
function openSheet(html, onClick, stack) {
  if (stack) { const prev = $('.shade:not(.under)'); if (prev) prev.classList.add('under'); } else closeSheet();
  const sh = makeShade(html, onClick);
  document.body.appendChild(sh);
  document.body.classList.add('lock');
  return sh;
}
// หน้าต่างย่อยที่ซ้อนบนหน้าต่างเดิม — กดกลับ/ปิดแล้วกลับไปหน้าต่างเดิม
const stackSheet = (html, onClick) => openSheet(html, onClick, true);
// ปิดทุกหน้าต่าง (ใช้หลังทำรายการเสร็จ)
function closeSheet() {
  document.querySelectorAll('.shade').forEach(s => s.remove());
  document.body.classList.remove('lock');
}
// ปิดเฉพาะหน้าต่างบนสุด — ถ้าข้างใต้มีหน้าต่างเดิม (เช่นกล่องยืนยัน) ให้กลับไปที่หน้าต่างนั้น
function popSheet() {
  const all = document.querySelectorAll('.shade');
  if (!all.length) return false;
  all[all.length - 1].remove();
  const prev = all[all.length - 2];
  if (prev) prev.classList.remove('under'); else document.body.classList.remove('lock');
  return true;
}
// กล่องยืนยัน: ซ้อนบนหน้าต่างเดิม กด "ไม่" แล้วกลับไปหน้าต่างเดิม
function askConfirm(title, okText, cb, noText) {
  const prev = $('.shade:not(.under)');
  if (prev) prev.classList.add('under');
  const sh = makeShade('<h3>' + esc(title) + '</h3>' +
    '<button class="btn" data-a="yes" style="margin-top:6px">' + esc(okText) + '</button>' +
    '<button class="link" data-a="no">' + esc(noText || 'กลับ') + '</button>',
    a => { if (a === 'yes') { closeSheet(); cb(); } else popSheet(); });
  document.body.appendChild(sh);
  document.body.classList.add('lock');
}
// ปัดหน้าต่างลงเพื่อปิด (ทำงานเมื่อเลื่อนเนื้อหาขึ้นไปบนสุดแล้ว)
function swipeToClose(sheet) {
  let y0 = 0, dy = 0, on = false;
  sheet.addEventListener('touchstart', e => { on = sheet.scrollTop <= 0; y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (!on) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { e.preventDefault(); sheet.style.transform = `translateY(${dy}px)`; sheet.style.transition = 'none'; }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (!on) return;
    sheet.style.transition = 'transform .18s'; sheet.style.transform = '';
    if (dy > 90) popSheet();
    on = false;
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.shade')) popSheet(); });

// ให้หน้าต่างอยู่เหนือคีย์บอร์ด (iPhone ไม่ย่อหน้าจอให้เอง)
if (window.visualViewport) {
  const fit = () => document.documentElement.style.setProperty('--vvh', visualViewport.height + 'px');
  visualViewport.addEventListener('resize', fit);
  fit();
}

/*** ---------- ปุ่มย้อนกลับของมือถือ (Android ปุ่มกลับ · iPhone ปัดขอบจอ) ---------- ***/
// หน้าเว็บกำหนด window.appBack = { need: () => มีอะไรให้ถอยไหม, handle: () => ถอย 1 ขั้น }
// วิธีทำงาน: ขณะที่มีอะไรให้ถอย จะมีประวัติหน้าเว็บสำรองไว้ 1 ชั้น กดกลับแล้วถอยในแอปแทนการออกจากเว็บ
const HB = { armed: false, skip: false, t: 0 };
function backSync() {
  clearTimeout(HB.t);
  HB.t = setTimeout(() => {
    const need = !!(window.appBack && appBack.need());
    if (need && !HB.armed) { history.pushState({ k10: 1 }, ''); HB.armed = true; }
    else if (!need && HB.armed) { HB.skip = true; HB.armed = false; history.back(); }
  }, 80);
}
window.addEventListener('popstate', () => {
  if (HB.skip) { HB.skip = false; return backSync(); }
  HB.armed = false;
  if (window.appBack) appBack.handle();
  backSync();
});
new MutationObserver(backSync).observe(document.body, { childList: true, subtree: true });

/*** ---------- บัตรสมาชิก (ใช้ทั้งหน้าลูกค้าและหน้าช่าง) ---------- ***/
const TIER_C = ['#B98260', '#C8C9CC', '#C9A66B', '#A9C3D9', '#C9B3DD'];
function tierBadge(t) {
  const c = TIER_C[t.idx % TIER_C.length];
  const ic = t.count > 1 && t.idx === t.count - 1 ? 'ti-crown' : 'ti-medal';

}
function memberCard(m) {

    <div style="display:flex;justify-content:space-between" class="mu"><span>สะสมรวม ${m.lifetime}</span><span>${nx ? esc(nx.name) + ' ' + nx.min : 'ระดับสูงสุด'}</span></div>

function rewardList(rewards, points, clickable) {

/*** ---------- โลโก้ร้าน (เก็บในเครื่อง โหลดใหม่เฉพาะตอนร้านเปลี่ยนรูป) ---------- ***/
const LOGO = { ver: '', data: '', shape: 'circle' };
async function ensureLogo(ver, shape) {
  LOGO.shape = shape || 'circle';
  if (!ver) { LOGO.ver = ''; LOGO.data = ''; return; }
  if (LOGO.ver === ver && LOGO.data) return;
  const c = store.get('k10_logo', null);
  if (c && c.ver === ver && c.data) { LOGO.ver = ver; LOGO.data = c.data; return; }
  try {
    const r = await call('getLogo');
    if (r && r.data) { LOGO.ver = r.ver; LOGO.data = r.data; store.set('k10_logo', { ver: r.ver, data: r.data }); }
  } catch (e) {}
}
// ยังไม่ตั้งโลโก้ → ใช้ "๑๐" แบบเดียวกับไอคอนแอป
const DEF_LOGO = (location.pathname.indexOf('/book/') >= 0 ? '../' : '') + 'icon-512.png?v=2';

// สรุปโปรโมชั่น (เฉพาะที่เปิดอยู่) — หน้าตาเดียวกับเงื่อนไขสมาชิก

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const B = { open: {}, sess: store.get('k10_sess', ''), date: '', d: null, set: null, view: 'list', timer: null };

async function api(fn, ...args) {
  try { return await call(fn, B.sess, ...args); }
  catch (e) {
    if (String(e && e.message || e).indexOf('AUTH') >= 0) { store.del('k10_sess'); B.sess = ''; showLogin(); throw e; }
    toast('เชื่อมต่อไม่สำเร็จ'); throw e;
  }
}

/*** ---------- แป้นตัวเลข PIN ---------- ***/
function padHtml(title) {
  return `<div class="mu" id="kt" style="margin-bottom:16px">${esc(title)}</div>
    <div class="dots" id="kd"></div><div class="err" id="ke" style="min-height:20px;margin:10px 0 14px;display:block"></div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="ok" class="ok" aria-label="ยืนยัน PIN"><i class="ti ti-check"></i></button><button data-k="0">0</button>
      <button data-k="del" class="del" aria-label="ลบตัวเลขล่าสุด"><i class="ti ti-backspace"></i></button></div>`;
}
// onOk(ค่า, pad) — pad.reset(หัวข้อใหม่, ข้อความผิดพลาด) เพื่อเริ่มใส่ใหม่
function bindPad(root, onOk, autoLen) {
  let v = '', busy = false;
  const dots = () => {
    const n = (autoLen && autoLen()) || Math.max(4, v.length);
    $('#kd', root).innerHTML = Array.from({ length: Math.max(n, v.length) }, (_, i) => `<span class="${i < v.length ? 'on' : ''}"></span>`).join('');
  };
  const pad = {
    reset(title, err) { v = ''; busy = false; if (title) $('#kt', root).textContent = title; $('#ke', root).textContent = err || ''; dots(); },
    wait(msg) { busy = true; $('#ke', root).textContent = msg; }
  };
  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-k]'); if (!b || busy) return;
    const k = b.dataset.k;
    if (k === 'ok') {
      if (v.length < 4) { $('#ke', root).textContent = 'PIN 4–8 หลัก'; return; }
      return onOk(v, pad);
    }
    if (k === 'del') v = v.slice(0, -1); else if (v.length < 8) v += k;
    $('#ke', root).textContent = '';
    dots();
    const n = autoLen ? autoLen() : 0;
    if (k !== 'del' && n && v.length === n) onOk(v, pad);
  });
  dots();
  return pad;
}

/*** ---------- เข้าสู่ระบบ ---------- ***/
async function showLogin() {
  clearInterval(B.timer);
  $('#nav').style.display = 'none';
  $('#app').className = 'wrap';
  const st = await call('barberStatus');
  await ensureLogo(st.logoVer, st.logoShape);
  const first = !st.hasPin, t1 = first ? 'ตั้ง PIN สำหรับช่าง (4–8 หลัก)' : 'ใส่ PIN';
  $('#app').innerHTML = `<div id="pr" style="text-align:center;padding-top:36px">
      ${logoTag(64, 'display:block;margin:0 auto') || '<i class="ti ti-scissors au" style="font-size:26px"></i>'}
      <div class="sv brand" style="margin:8px 0 18px">${esc(st.shop)}</div>${padHtml(t1)}</div>`;
  let firstVal = '';
  bindPad($('#pr'), async (v, pad) => {
    if (first && !firstVal) { firstVal = v; return pad.reset('ใส่ PIN อีกครั้ง'); }
    if (first && v !== firstVal) { firstVal = ''; return pad.reset(t1, 'PIN สองครั้งไม่ตรงกัน'); }
    pad.wait('กำลังตรวจ…');
    const r = await call(first ? 'barberSetPin' : 'barberLogin', v).catch(() => ({ ok: false, msg: 'เชื่อมต่อไม่สำเร็จ' }));
    if (!r.ok) { firstVal = ''; return pad.reset(first ? t1 : null, r.msg); }
    B.sess = r.sess; store.set('k10_sess', r.sess);
    boot();
  }, () => first ? firstVal.length : st.pinLen);
}

/*** ---------- คิววันนี้ ---------- ***/
async function boot() {
  if (!B.sess) return showLogin();
  $('#nav').style.display = '';
  saveSessForSw(B.sess);
  try { await loadDay(B.date); } catch (e) { return; }
  keepAwake();
  clearInterval(B.timer);
  B.timer = setInterval(() => { if (!drag && !(B.view === 'list' && $('.shade'))) loadDay(B.date).catch(() => {}); }, 30000);
}

// ให้จอติดค้างไว้ ช่างมองคิวจากไกลได้ (ถ้าเบราว์เซอร์ไม่ยอมก็ข้ามไปเงียบ ๆ)
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => { wakeLock = null; }; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && B.sess) { keepAwake(); if (B.view === 'list') loadDay(B.date).catch(() => {}); } });

async function loadDay(date) {
  const d = await api('barberDay', date || '');
  checkNew(d.newest);
  if (drag) return;
  B.d = d; B.date = d.date;
  if (B.view === 'list') renderList();
}

// ปฏิทินเลือกวัน (แตะวันที่บนหน้าคิว) — ตัวเลขทอง = จำนวนคิววันนั้น
function calSheet() {
  const d = B.d;
  let ym = d.date.slice(0, 7), counts = {}, loaded = false;
  const draw = () => {
    const [y, m] = ym.split('-').map(Number), first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    const cells = Array.from({ length: (first + 6) % 7 }, () => '<span></span>');   // เริ่มสัปดาห์วันจันทร์
    for (let i = 1; i <= n; i++) {
      const ds = ym + '-' + String(i).padStart(2, '0'), hol = d.holidays.indexOf(ds) >= 0, off = d.closedDays.indexOf(wday(ds)) >= 0;
      const cls = [ds < d.today ? 'past' : '', off ? 'off' : '', hol ? 'hol' : '', ds === d.today ? 'today' : '', ds === d.date ? 'sel' : ''].join(' ');
      cells.push(`<button class="${cls}" data-a="go" data-d="${ds}">${i}<small>${hol ? 'หยุด' : counts[ds] || ''}</small></button>`);
    }
    return `<div style="display:flex;justify-content:space-between;align-items:center;margin:0 36px 10px 0">
        <button data-a="pm" class="mu" style="font-size:24px;padding:4px 12px" aria-label="เดือนก่อน"><i class="ti ti-chevron-left"></i></button>
        <span style="font-size:19px">${MO_FULL[m - 1]} ${y + 543}</span>
        <button data-a="nm" class="mu" style="font-size:24px;padding:4px 12px" aria-label="เดือนถัดไป"><i class="ti ti-chevron-right"></i></button></div>
      <div class="calg">${['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'].map(x => `<span class="h">${x}</span>`).join('')}${cells.join('')}</div>
      <div class="mu" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px"><span>${loaded ? '<span class="au">ตัวเลขทอง</span> = จำนวนคิว' : '<i class="ti ti-loader-2"></i> กำลังโหลดจำนวนคิว…'}</span><span style="color:var(--dim)">วันหยุดประจำ</span><span style="color:var(--c-noshow)">หยุดพิเศษ</span></div>
      <button class="btn line" data-a="go" data-d="${d.today}" style="margin-top:14px">กลับวันนี้</button>`;
  };
  const load = async () => {
    const want = ym;
    const r = await api('barberMonth', want).catch(() => null);
    if (!r || want !== ym || !sh.isConnected) return;
    counts = r.counts; loaded = true; $('.sbody', sh).innerHTML = draw();
  };
  const sh = openSheet(draw(), (a, b) => {
    if (a === 'go') { closeSheet(); return loadDay(b.dataset.d).catch(() => {}); }
    if (a === 'pm' || a === 'nm') {
      const [y, m] = ym.split('-').map(Number), t = new Date(Date.UTC(y, m - 1 + (a === 'nm' ? 1 : -1), 1));
      ym = t.toISOString().slice(0, 7); counts = {}; loaded = false;
      $('.sbody', sh).innerHTML = draw(); load();
    }
  });
  load();
}

function isToday() { return B.d.date === B.d.today; }

// ช่องเวลาทั้งวัน แต่ละช่องผูกกับคิวที่เริ่มในช่วงนั้น
function cells() {
  const d = B.d, open = toMin(d.open), close = toMin(d.close), slot = d.slotMin, map = new Map();
  for (let m = open; m + slot <= close; m += slot) map.set(m, { m: m, r: null });
  d.rows.forEach(r => {
    const rm = toMin(r.time);
    const key = rm >= open && rm < close ? open + Math.floor((rm - open) / slot) * slot : rm;
    if (!map.has(key)) map.set(key, { m: key, r: null });
    const c = map.get(key);
    // คิวที่ยังกินเวลา (รอ/เสร็จ/ปิด) สำคัญกว่าคิวที่ไม่มา
    const rank = x => x.status === 'xcancel' ? 0 : x.status === 'noshow' ? 1 : 2;
    if (!c.r || rank(r) > rank(c.r)) c.r = r;
  });
  return [...map.values()].sort((a, b) => a.m - b.m);
}

function currentRow() {
  if (!isToday()) return null;
  const n = B.d.nowMin, bk = B.d.rows.filter(r => r.status === 'booked');
  const cur = bk.find(r => toMin(r.time) <= n && n < toMin(r.time) + r.dur);
  if (cur) return { r: cur, label: 'ตอนนี้' };
  const next = bk.find(r => toMin(r.time) >= n);
  return next ? { r: next, label: 'ถัดไป' } : null;
}

// บรรทัด "ถัดไป" (แสดงเฉพาะแท็บเล็ตแนวนอน ที่มีที่ว่างด้านซ้าย)
function nextLine(r) {
  const nx = B.d.rows.filter(x => x.status === 'booked' && x.time > r.time).sort((a, b) => a.time.localeCompare(b.time))[0];
  return nx ? `<div class="nextline mu">ถัดไป <span class="sv" style="color:var(--text)">${esc(nx.time)}</span> ${esc(nx.name)}</div>` : '';
}

function renderList() {

  B.view = 'list'; navOn('list');
  const d = B.d, rows = d.rows, today = isToday();
  const total = rows.filter(r => r.status !== 'block' && r.status !== 'xcancel').length;
  const done = rows.filter(r => r.status === 'done').length;
  const wait = rows.filter(r => r.status === 'booked').length;
  const cur = currentRow();
  const list = cells(), half = Math.ceil(list.length / 2);
  const left = cur
    ? `<div style="flex:1;min-width:0" data-a="row" data-id="${cur.r.id}">
        <div class="mu now-label">${cur.label}</div>
        <div class="sv au now-time">${esc(cur.r.time)}</div>
        <div class="now-row">
          <span style="flex:1;min-width:0"><span class="now-name">${esc(cur.r.name)}</span>${memTags(cur.r)}</span>
          <button class="ring now-ring" data-a="done" data-id="${cur.r.id}" aria-label="ตัดเสร็จ · เลือกราคา"><i class="ti ti-check"></i></button>
        </div>${nextLine(cur.r)}</div>`
    : `<div style="flex:1;min-width:0">
        <div class="mu now-label" style="${d.closed ? 'color:var(--warn)' : ''}">${d.closed ? 'วันหยุด' : today ? 'ไม่มีคิวรอ' : 'คิววัน' + WD_FULL[wday(d.date)]}</div>
        <div class="sv now-time ${today ? '' : 'au'}" style="color:${today ? 'var(--dim)' : ''}">${today ? 'ว่าง' : ymd(d.date)[2] + ' ' + MO[ymd(d.date)[1] - 1]}</div></div>`;
  $('#app').className = 'wrap fit';
  $('#app').innerHTML = `
    <div class="head" style="margin-bottom:10px">
      <span class="sv brand" style="font-size:20px">๑๐ กันยา</span>
      <span class="dnav">
        ${today ? '' : '<button data-a="today" class="back" aria-label="กลับวันนี้"><i class="ti ti-arrow-back-up"></i><span class="bt"> วันนี้</span></button>'}
        <button data-a="prev" aria-label="วันก่อน"><i class="ti ti-chevron-left"></i></button>
        <button data-a="cal" class="dpick" aria-label="เลือกวันจากปฏิทิน"><i class="ti ti-calendar"></i>${today ? 'วันนี้ · ' + dShort(d.date) : dShort(d.date)}</button>
        <button data-a="next" aria-label="วันถัดไป"><i class="ti ti-chevron-right"></i></button>
      </span>
    </div>
    <div class="card nowb">
      ${left}
      <div class="nstat">
        <span title="ทั้งหมด"><i class="ti ti-users"></i> ${total}</span>

    <div class="grid" id="grid" style="grid-template-rows:repeat(${half},minmax(0,1fr))">${list.map(cellHtml).join('')}</div>`;
  bindDrag($('#grid'));
}

function cellHtml(c) {
  const d = B.d, r = c.r, time = toHM(c.m);
  const past = d.date < d.today || (isToday() && c.m + d.slotMin <= d.nowMin);
  const cur = currentRow();
  let kind = r ? r.status : d.free.indexOf(time) >= 0 ? 'free' : (d.breaks || []).indexOf(time) >= 0 ? 'brk' : 'cont';
  const late = kind === 'booked' && past;
  const xc = kind === 'xcancel';   // ลูกค้าเพิ่งยกเลิก: ช่องว่าง แตะเพื่อลงคิวใหม่ได้
  const cls = ['cell', 'k-' + kind, xc && d.free.indexOf(time) >= 0 ? 'k-free' : '', past ? 'past' : '', late ? 'late' : '', cur && r && cur.r.id === r.id ? 'cur' : ''].join(' ');
  const name = kind === 'xcancel' ? `${esc(r.name)} <i class="ti ti-calendar-x" style="font-size:13px"></i>` : kind === 'block' ? '<i class="ti ti-lock"></i>' : kind === 'brk' ? '<i class="ti ti-tools-kitchen-2"></i> พัก' : kind === 'free' || kind === 'cont' ? '' :
    esc(r.name) + (r.source === 'walkin' && !r.phone ? ' <i class="ti ti-walk" style="font-size:13px;opacity:.6"></i>' : '') +
    (r.m && r.m.gift ? ' <i class="ti ti-gift au" style="font-size:14px"></i>' : '') +
    (r.m && r.m.warn ? ' <i class="ti ti-alert-triangle" style="font-size:14px;color:var(--c-noshow)"></i>' : '') +
    (r.m && r.m.mv ? ' <i class="ti ti-arrows-exchange" style="font-size:14px;color:var(--c-move)"></i>' : '') +
    (r.note ? ' <i class="ti ti-message-dots" style="font-size:14px;color:var(--c-note)"></i>' : '');
  return `<div class="${cls}" data-a="cell" data-t="${time}" ${r && !xc ? `data-id="${r.id}"` : ''}>
    <span class="t">${esc(r ? r.time : time)}</span><span class="n">${name}</span></div>`;
}

$('#app').addEventListener('click', async e => {
  if (B.view !== 'list' || B.justDragged) return;
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'prev' || a === 'next') return loadDay(addDays(B.d.date, a === 'prev' ? -1 : 1)).catch(() => {});
  if (a === 'today') return loadDay('').catch(() => {});

      <div class="mu" style="margin-bottom:8px">ลูกค้าเห็นช่องนี้เป็นคิวเต็ม</div>
      <button class="act gold" data-a="bo"><i class="ti ti-lock-open"></i>เปิดรับคิวช่วงนี้ (เฉพาะวันนี้)</button>`,
      () => act({ action: 'breakopen', date: B.d.date, time: b.dataset.t }, 'เปิดรับคิว ' + b.dataset.t + ' แล้ว'));
  }
});

/*** ---------- กดค้างแล้วลากคิวไปช่องว่าง ---------- ***/
let drag = null;
function bindDrag(grid) {
  let timer = null, sx = 0, sy = 0, ghost = null;
  grid.oncontextmenu = e => e.preventDefault();
  grid.onpointerdown = e => {
    const c = e.target.closest('.cell[data-id]');
    const r = c && B.d.rows.find(x => x.id === c.dataset.id);
    if (!r || r.status !== 'booked') return;
    sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      drag = { r: r, src: c, target: null };
      try { c.setPointerCapture(e.pointerId); } catch (err) {}
      c.classList.add('lift'); grid.classList.add('dragging');
      if (navigator.vibrate) navigator.vibrate(30);
      ghost = document.createElement('div');
      ghost.className = 'ghost';
      ghost.innerHTML = `<span class="sv">${esc(r.time)}</span> ${esc(r.name)}`;
      document.body.appendChild(ghost);
      moveGhost(sx, sy);
    }, 450);
  };
  const moveGhost = (x, y) => { if (ghost) ghost.style.transform = `translate(${x - 60}px, ${y - 46}px)`; };
  grid.onpointermove = e => {
    if (!drag) {
      if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { clearTimeout(timer); timer = null; }
      return;
    }
    e.preventDefault();
    moveGhost(e.clientX, e.clientY);
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const t = el && el.closest('.cell.k-free:not(.past)');
    if (drag.target !== t) {
      if (drag.target) drag.target.classList.remove('drop');
      if (t) t.classList.add('drop');
      drag.target = t;
    }
  };
  const end = () => {
    clearTimeout(timer); timer = null;
    if (!drag) return;
    const dd = drag;
    drag = null;
    dd.src.classList.remove('lift'); grid.classList.remove('dragging');
    if (ghost) { ghost.remove(); ghost = null; }
    B.justDragged = true; setTimeout(() => { B.justDragged = false; }, 350);
    if (!dd.target) return;
    dd.target.classList.remove('drop');
    const to = dd.target.dataset.t;
    askConfirm(`ย้าย ${dd.r.name} → ${to}`, 'ย้าย', () => moveAct(dd.r, B.d.date, to), 'ไม่ย้าย');
  };
  grid.onpointerup = end;
  grid.onpointercancel = end;
}

/*** ---------- แจ้งเตือนเมื่อลูกค้าจองใหม่ (ตอนเปิดหน้าช่างอยู่) ---------- ***/
let audioCtx = null;
document.addEventListener('pointerdown', () => {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
});
function chime() {
  if (!audioCtx) return;
  [[988, 0], [1319, 0.18], [1568, 0.36]].forEach(([f, t]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = audioCtx.currentTime + t;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.35, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.5);
    o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at + 0.55);
  });
}
function checkNew(n) {
  if (!n) return;
  const seen = store.get('k10_seen', null);
  if (!seen) return store.set('k10_seen', { id: n.id, at: n.at });
  if (seen.id === n.id || n.at <= seen.at) return;
  store.set('k10_seen', { id: n.id, at: n.at });
  chime();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  const old = $('.newbk'); if (old) old.remove();
  const el = document.createElement('button');
  const k = n.kind || 'new', f = n.from || {};
  el.className = 'newbk k-' + k;
  const when = k === 'move' ? `${dShort(f.date)} <span class="sv">${esc(f.time)}</span> → ${f.date === n.date ? '' : dShort(n.date) + ' '}<span class="sv">${esc(n.time)}</span>`
    : `${dShort(n.date)} · <span class="sv">${esc(n.time)}</span>`;
  const [ic, title] = { new: ['ti-bell-ringing', 'จองใหม่'], move: ['ti-arrows-exchange', 'ลูกค้าเลื่อนคิว'], cancel: ['ti-calendar-x', 'ลูกค้ายกเลิกคิว'], edit: ['ti-message-dots', 'ลูกค้าแก้ข้อความ'] }[k] || ['ti-bell-ringing', 'คิวเปลี่ยน'];
  el.innerHTML = `<i class="ti ${ic}"></i><span><b>${title} · ${esc(n.name)}</b><br>${when}${n.note && k !== 'cancel' ? `<br>💬 ${esc(n.note)}` : ''}</span><i class="ti ti-x" style="margin-left:auto;opacity:.6"></i>`;
  el.onclick = () => { el.remove(); B.view = 'list'; loadDay(n.date).catch(() => {}); };
  document.body.appendChild(el);
}

async function act(p, msg) {
  closeSheet();
  let r;
  try { r = await api('barberAction', p); } catch (e) { return; }
  if (!r.ok) return toast(r.msg);
  B.d = r.day; B.date = r.day.date;
  checkNew(r.day.newest);
  if (r.points) B.recent = null;
  renderList();
  const pt = r.points;
  if (pt) msg += ` · +${pt.earn} แต้ม${pt.mult > 1 ? ' (×' + pt.mult + ')' : ''}${pt.bonus.length ? ' · ' + pt.bonus.join(' · ') : ''} · รวม ${pt.member.points}`;
  if (msg) toast(msg);
  if (pt && pt.tierUp) celebrate(`🎉 ${pt.member.name || 'ลูกค้า'} ขึ้นระดับ${pt.tierUp}แล้ว`);
}

// เลื่อนคิวแล้ว ถ้ามีเบอร์ลูกค้า → ปุ่มส่ง SMS (เปิดแอปข้อความพร้อมข้อความ ช่างกดส่งเอง)
async function moveAct(r, date, time) {
  const old = { date: B.d.date, time: r.time };   // คิวในตารางเป็นของวันที่เปิดดูอยู่
  await act({ action: 'move', id: r.id, date: date, time: time }, 'เลื่อนเป็น ' + time);
  if (!r.phone || (old.date === date && old.time === time)) return;
  const now = B.d.rows.find(x => x.id === r.id);
  if (B.d.date !== date || !now || now.time !== time) return;   // เลื่อนไม่สำเร็จ
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const msg = `๑๐ กันยา: ขอเลื่อนคิวคุณ${r.name} จาก ${dShort(old.date)} ${old.time} เป็น ${dShort(date)} ${time} ครับ` +
    (r.token ? `\nดูตั๋ว / เลื่อนเวลาเอง: ${CUSTOMER_URL}?t=${r.token}` : '');
  openSheet(`<h3>แจ้งลูกค้า</h3>
    <div class="mu" style="margin-bottom:10px">${esc(r.name)} · ${esc(r.phone)}</div>
    <div class="pq" style="white-space:pre-line">${esc(msg)}</div>
    <a class="btn" href="sms:${esc(r.phone)}${iOS ? '&' : '?'}body=${encodeURIComponent(msg)}" data-a="x" style="margin-top:14px"><i class="ti ti-message"></i> ส่ง SMS</a>
    <a class="btn line" href="tel:${esc(r.phone)}" data-a="x" style="margin-top:10px"><i class="ti ti-phone"></i> โทรแทน</a>
    <button class="link" data-a="x">ไม่แจ้ง</button>`, () => setTimeout(closeSheet, 300));
}

function rowSheet(r) {
  if (!r) return;
  const head = `<h3><span class="sv au" style="font-size:24px">${esc(r.time)}</span> &nbsp;${esc(r.name || 'ปิดช่วงเวลา')}</h3>`;
  let acts = '';
  if (r.status === 'booked') acts =
    (r.phone ? `<a class="act" href="tel:${esc(r.phone)}"><i class="ti ti-phone"></i>${esc(r.phone)}</a>` : '') +
    '<button class="act gold" data-a="done"><i class="ti ti-check"></i>เสร็จ</button>' +
    '<button class="act" data-a="noshow"><i class="ti ti-user-x"></i>ไม่มา</button>' +
    '<button class="act" data-a="move"><i class="ti ti-arrows-exchange"></i>เลื่อนเวลา</button>' +
    '<button class="act warn" data-a="cancel"><i class="ti ti-x"></i>ยกเลิกคิว</button>';
  else if (r.status === 'block') acts = '<button class="act gold" data-a="unblock"><i class="ti ti-lock-open"></i>เปิดรับคิวช่วงนี้</button>';
  else acts =
    (r.phone ? `<a class="act" href="tel:${esc(r.phone)}"><i class="ti ti-phone"></i>${esc(r.phone)}</a>` : '') +
    (r.status === 'done' ? `<button class="act" data-a="price"><i class="ti ti-receipt"></i>${r.price ? 'ราคา <span class="sv au" style="font-size:19px">฿' + r.price + '</span> · แตะเพื่อแก้' : 'ใส่ราคา'}</button>` : '') +
    (r.status === 'done' && r.price ? `<button class="act" data-a="paysw"><i class="ti ti-${r.pay === 'transfer' ? 'qrcode' : 'cash'}"></i>${r.pay ? (r.pay === 'cash' ? 'จ่ายเงินสด' : 'จ่ายโอน') + ' · แตะเพื่อเปลี่ยนเป็น' + (r.pay === 'cash' ? 'โอน' : 'เงินสด') : 'ยังไม่ระบุวิธีจ่าย · แตะเพื่อเลือก'}</button>` : '') +
    '<button class="act" data-a="booked"><i class="ti ti-arrow-back-up"></i>กลับเป็นรอคิว</button>';
  const note = r.note ? `<div class="pq"><i class="ti ti-message-dots" style="color:var(--c-note)"></i> ${esc(r.note)}</div>` : '';
  openSheet(head + memTags(r) + note + acts, a => {
    if (a === 'done') return doneFlow(r.id);
    if (a === 'price') return priceSheet(r, p => act({ action: 'price', id: r.id, price: p }, p ? 'ราคา ฿' + p : 'ลบราคาแล้ว'), true);
    if (a === 'paysw') {
      if (r.pay) { const to = r.pay === 'cash' ? 'transfer' : 'cash'; return act({ action: 'price', id: r.id, pay: to }, to === 'cash' ? 'เปลี่ยนเป็นเงินสดแล้ว' : 'เปลี่ยนเป็นโอนแล้ว'); }
      return stackSheet('<h3>วิธีจ่าย</h3><div class="chips" style="grid-template-columns:1fr 1fr"><button class="chip" data-a="cash"><i class="ti ti-cash"></i> เงินสด</button><button class="chip" data-a="transfer"><i class="ti ti-qrcode"></i> โอน</button></div>',
        x => act({ action: 'price', id: r.id, pay: x }, 'บันทึกวิธีจ่ายแล้ว'));
    }
    if (a === 'move') return moveSheet(r, B.d.date);
    if (a === 'cancel') return askConfirm(`ยกเลิกคิว ${r.time} ${r.name}?`, 'ยกเลิกคิว', () => act({ action: 'cancel', id: r.id }, 'ยกเลิกแล้ว'));
    act({ action: a, id: r.id }, { done: 'เสร็จแล้ว', noshow: 'บันทึกว่าไม่มา', unblock: 'เปิดรับคิวแล้ว', booked: 'กลับเป็นรอคิวแล้ว' }[a]);
  });
}

function freeAhead(day) {
  const today = day.date === day.today;
  return day.free.filter(t => !today || toMin(t) + day.slotMin > day.nowMin);
}

function slotChips(list, pick) {
  if (!list.length) return '<div class="mu" style="padding:10px 0 4px">ไม่มีช่วงว่าง</div>';
  return '<div class="chips sv" style="grid-template-columns:repeat(4,1fr);margin-bottom:6px">' +
    list.map(t => `<button class="chip ${t === pick ? 'on' : ''}" data-a="pick" data-t="${t}" style="font-size:17px">${t}</button>`).join('') + '</div>';
}

// ปุ่มวัน 7 วันที่ร้านเปิด นับจากวันนี้
function openDays(sel) {
  const d = B.d, out = [];
  for (let i = 0; out.length < 7 && i < 30; i++) {
    const ds = addDays(d.today, i);
    if (d.closedDays.indexOf(wday(ds)) < 0 && d.holidays.indexOf(ds) < 0) out.push(ds);
  }
  if (sel && out.indexOf(sel) < 0) out.unshift(sel);
  return out;
}
function dayChips(sel) {
  return '<div class="chips" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">' + openDays(sel).map(ds =>
    `<button class="chip ${ds === sel ? 'on' : ''}" data-a="day" data-d="${ds}">${ds === B.d.today ? 'วันนี้' : WD[wday(ds)]}<small>${ymd(ds)[2]} ${MO[ymd(ds)[1] - 1]}</small></button>`).join('') + '</div>';
}
async function dayData(date) { return date === B.d.date ? B.d : api('barberDay', date).catch(() => null); }

// ซ้อนบนเมนูคิว (กดกลับแล้วกลับไปเมนูคิวเดิม) · เปลี่ยนวันแล้ววาดใหม่ในหน้าต่างเดิม
async function moveSheet(r, date) {
  let cur = date, sh = null;
  const draw = async () => {
    const day = await dayData(cur);
    if (!day) return;
    const html = `<h3>เลื่อน ${esc(r.name)}</h3>${dayChips(day.date)}${slotChips(freeAhead(day), '')}`;
    if (sh) { $('.sbody', sh).innerHTML = html; return; }
    sh = stackSheet(html, (a, b) => {
      if (a === 'day') { cur = b.dataset.d; return draw(); }
      if (a === 'pick') moveAct(r, cur, b.dataset.t);
    });
  };
  draw();
}

async function addSheet(time, date) {
  date = date || (B.d.date < B.d.today ? B.d.today : B.d.date);
  const day = await dayData(date);
  if (!day) return;
  if (!B.recent) B.recent = (await api('barberMembers', '').catch(() => [])).slice(0, 8);
  const free = freeAhead(day);
  const st = { pick: free.indexOf(time) >= 0 ? time : '', who: null, find: false };   // who = null คือไม่ระบุชื่อ
  const foundHtml = () => (st.found || []).map(m => `<button class="chip" data-a="pickm" data-p="${esc(m.phone)}">${esc(m.name || '—')}<small>${esc(m.phone)}</small></button>`).join('');
  const html = () => `<h3>เพิ่มคิว</h3>${dayChips(day.date)}${slotChips(free, st.pick)}
    <div class="mu" style="margin:12px 0 8px"><i class="ti ti-users"></i> ลูกค้า</div>
    <div class="chips" style="grid-template-columns:repeat(2,1fr);margin-bottom:8px">
      <button class="chip ${!st.who && !st.find ? 'on' : ''}" data-a="walk"><i class="ti ti-walk"></i> ไม่ระบุ</button>
      <button class="chip ${st.find ? 'on' : ''}" data-a="find"><i class="ti ti-search"></i> ค้นหา / ใหม่</button>
      ${B.recent.map(m => `<button class="chip ${st.who && st.who.phone === m.phone ? 'on' : ''}" data-a="who" data-p="${esc(m.phone)}">${esc(m.name || m.phone)}<small>${esc(m.phone.slice(-4))}</small></button>`).join('')}
    </div>
    ${st.find ? `<div class="field"><i class="ti ti-search"></i><input id="fq" value="${esc(st.q || '')}" placeholder="เบอร์ (4 ตัวท้ายก็ได้) หรือชื่อ" autocomplete="off"></div>
      <div id="fr" class="chips" style="grid-template-columns:repeat(2,1fr);margin:8px 0">${foundHtml()}</div>
      <div class="mu" style="margin-top:4px">ลูกค้าใหม่</div>
      <div class="field"><i class="ti ti-user"></i><input id="an" value="${esc(st.nn || '')}" placeholder="ชื่อ" maxlength="40"></div>
      <div class="field"><i class="ti ti-phone"></i><input id="ap" value="${esc(st.np || '')}" placeholder="เบอร์โทร" inputmode="tel" maxlength="12"></div>` : ''}
    <div class="err" id="aerr"></div>
    <button class="btn" data-a="walkin" style="margin-top:16px">${st.pick ? `เพิ่ม ${esc(st.who ? st.who.name || st.who.phone : 'walk-in')} · ${st.pick}` : 'เพิ่มคิว'}</button>
    <button class="btn line" data-a="block" style="margin-top:10px"><i class="ti ti-lock"></i> ปิดช่วงนี้ ไม่รับคิว</button>`;
  const draw = () => {
    $('.sbody', sh).innerHTML = html();
    if (!st.find) return;
    $('#an', sh).oninput = e => { st.nn = e.target.value; };
    $('#ap', sh).oninput = e => { st.np = e.target.value; };
    let tm;
    $('#fq', sh).addEventListener('input', e => {
      st.q = e.target.value;
      clearTimeout(tm);
      tm = setTimeout(async () => {
        const q = e.target.value.trim();
        const list = q ? await api('barberMembers', q).catch(() => []) : [];
        st.found = list.slice(0, 6);
        $('#fr', sh).innerHTML = foundHtml();
      }, 300);
    });
  };
  const sh = openSheet('', (a, b) => {
    if (a === 'day') return addSheet(st.pick, b.dataset.d);
    if (a === 'pick') { st.pick = b.dataset.t; return draw(); }
    if (a === 'walk') { st.who = null; st.find = false; return draw(); }
    if (a === 'find') { st.who = null; st.find = true; draw(); return $('#fq', sh).focus(); }
    if (a === 'who') { st.who = B.recent.find(m => m.phone === b.dataset.p); st.find = false; return draw(); }
    if (a === 'pickm') { st.who = (st.found || []).find(m => m.phone === b.dataset.p); st.find = false; return draw(); }
    if (!st.pick) { $('#aerr', sh).textContent = 'เลือกเวลาก่อน'; return; }
    if (a === 'walkin') {
      let name = st.who ? st.who.name : '', phone = st.who ? st.who.phone : '';
      if (st.find) { name = st.nn || ''; phone = st.np || ''; }
      act({ action: 'walkin', date: day.date, time: st.pick, name, phone }, 'เพิ่มคิว ' + st.pick);
    }
    if (a === 'block') act({ action: 'block', date: day.date, time: st.pick }, 'ปิดช่วง ' + st.pick);
  });
  sh.classList.add('big');
  draw();
}

function timeOpts(v) {
  const a = [];
  for (let m = 0; m < 24 * 60; m += 30) a.push(toHM(m));
  if (a.indexOf(v) < 0) a.push(v);
  return a.sort().map(t => `<option ${t === v ? 'selected' : ''}>${t}</option>`).join('');
}

// ภาพ QR พร้อมชื่อร้าน (พื้นสว่างเพื่อให้กล้องสแกนง่าย)
let qrCache = { url: '', png: '' };
async function drawQr(url) {
  const img = $('#qr'), dl = $('#qrdl');
  if (!img) return;
  if (qrCache.url !== url || qrCache.logo !== LOGO.ver + LOGO.shape) {
    if (typeof qrcode !== 'function') { img.replaceWith(Object.assign(document.createElement('div'), { className: 'mu', textContent: 'โหลดตัวสร้าง QR ไม่ได้' })); return; }
    try { await document.fonts.ready; } catch (e) {}
    const qr = qrcode(0, 'M');
    qr.addData(url); qr.make();
    let lg = null;
    lg = new Image(); lg.src = logoSrc(); try { await lg.decode(); } catch (e) { lg = null; }
    const top = lg ? 150 : 0;   // ที่ว่างสำหรับโลโก้
    const n = qr.getModuleCount(), W = 720, H = 960 + top, cell = Math.floor(520 / n), size = cell * n, x0 = (W - size) / 2, y0 = 210 + top;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#F4EFE7'; g.fillRect(0, 0, W, H);
    if (lg) {
      const L = 150, lx = (W - L) / 2, ly = 50;
      g.save(); g.beginPath();
      if (LOGO.shape === 'square') { const r = 33; g.moveTo(lx + r, ly); g.arcTo(lx + L, ly, lx + L, ly + L, r); g.arcTo(lx + L, ly + L, lx, ly + L, r); g.arcTo(lx, ly + L, lx, ly, r); g.arcTo(lx, ly, lx + L, ly, r); }
      else g.arc(W / 2, ly + L / 2, L / 2, 0, Math.PI * 2);
      g.clip(); g.drawImage(lg, lx, ly, L, L); g.restore();
    }
    g.fillStyle = '#1B1815'; g.textAlign = 'center';
    g.font = '500 64px "Noto Serif Thai", Georgia, serif'; g.fillText('๑๐ กันยา', W / 2, 110 + top);
    g.fillStyle = '#FFFFFF'; g.fillRect(x0 - cell * 4, y0 - cell * 4, size + cell * 8, size + cell * 8);   // ขอบขาว 4 ช่องตามมาตรฐาน QR
    g.fillStyle = '#141210';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect(x0 + k * cell, y0 + r * cell, cell, cell);
    g.fillStyle = '#8A6A3A'; g.font = '500 40px "IBM Plex Sans Thai", sans-serif';
    g.fillText('สแกนเพื่อจองคิว', W / 2, y0 + size + cell * 4 + 80);
    qrCache = { url: url, logo: LOGO.ver + LOGO.shape, png: c.toDataURL('image/png') };
  }
  img.src = qrCache.png; dl.href = qrCache.png;
}

// อ่านค่าจากหน้าที่เปิดอยู่ (เฉพาะช่องที่มีในหน้านั้น)
function readSettings() {
  const s = B.set, v = id => $(id) ? $(id).value : null;
  if ($('#mnote')) s.memberNote = v('#mnote').trim();
  if ($('#ppid')) s.payment = { promptpay: v('#ppid').replace(/\D/g, ''), accName: v('#ppname').trim(), bankName: v('#bkname').trim(), bankAcc: v('#bkacc').trim() };
  if ($('#ntx')) s.notice = { on: s.notice.on, text: v('#ntx').trim(), until: v('#nun') || '' };
  document.querySelectorAll('.wsel').forEach(el => { s.week[+el.dataset.d][el.dataset.k] = el.value; });
  if ($('#ss')) { s.slotMin = +v('#ss'); s.phone = v('#sp').trim(); s.mapUrl = v('#sm').trim(); }
  const f = (el, k) => $('input[data-f="' + k + '"]', el).value;
  if (document.querySelector('.ed.tier')) {
    s.tiers = [...document.querySelectorAll('.ed.tier')].map(el => ({ name: f(el, 'name'), min: +f(el, 'min') || 0, earn: +f(el, 'earn') || 0 }));
    s.rewards = [...document.querySelectorAll('.ed.reward')].map(el => ({ icon: f(el, 'icon'), name: f(el, 'name'), cost: +f(el, 'cost') || 0 }));
  }
}

async function saveSet(btn) {
  if (btn && !setDirty()) return false;   // ไม่มีอะไรเปลี่ยน ไม่ต้องบันทึก / ไม่ต้องแจ้ง
  if (btn) btn.classList.add('busy');
  let r;
  try { r = await api('saveSettings', B.set); } catch (err) { if (btn) btn.classList.remove('busy'); return false; }
  if (btn) btn.classList.remove('busy');
  if (!r.ok) { if ($('#serr')) $('#serr').textContent = r.msg; else toast(r.msg); return false; }
  B.setSaved = r.settings; B.set = clone(r.settings);
  renderSettings();
  toast(r.orphans ? `บันทึกแล้ว · มีคิวตรงวันหยุด ${r.orphans} คิว` : 'บันทึกแล้ว');
  loadDay(B.date).catch(() => {});
  return true;
}

// โลโก้: บันทึกทันที (ไม่รอปุ่มบันทึกของหน้าร้าน)
async function saveLogo(data, shape, del, msg) {
  const r = await api('barberSetLogo', data, shape, del).catch(() => null);
  if (!r) return;
  if (!r.ok) return toast(r.msg);
  B.setSaved.logoVer = B.set.logoVer = r.ver; B.setSaved.logoShape = B.set.logoShape = r.shape;
  if (data) { LOGO.ver = r.ver; LOGO.data = data; store.set('k10_logo', { ver: r.ver, data: data }); }
  if (del) { LOGO.ver = ''; LOGO.data = ''; store.del('k10_logo'); }
  LOGO.shape = r.shape;
  closeSheet(); renderSettings(); toast(msg);
}
// เลือกรูปแล้ว: ลากจัดตำแหน่ง + ซูม → ย่อเป็น 256×256
function cropSheet(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onerror = () => toast('เปิดรูปนี้ไม่ได้');
  img.onload = () => {
    const V = Math.min(260, innerWidth - 80), base = V / Math.min(img.width, img.height);
    let z = 1, x = 0, y = 0;
    const sh = openSheet(`<h3>จัดโลโก้</h3>
      <div class="crop" id="cb" style="width:${V}px;height:${V}px"><img id="ci" src="${url}" alt=""><div class="cmask ${LOGO.shape}"></div></div>
      <div class="mu" style="text-align:center">ลากรูปเพื่อจัดตำแหน่ง</div>
      <div class="row" style="border:0"><i class="ti ti-zoom-out mu"></i><input type="range" id="cz" min="1" max="4" step="0.01" value="1" style="flex:1;accent-color:var(--gold)"><i class="ti ti-zoom-in mu"></i></div>
      <button class="btn" data-a="use">ใช้รูปนี้</button>`, async a => {
        if (a !== 'use') return;
        const O = 256, k = O / V, s = base * z * k, c = document.createElement('canvas');
        c.width = c.height = O;
        const g = c.getContext('2d');
        const put = () => g.drawImage(img, (O - img.width * s) / 2 + x * k, (O - img.height * s) / 2 + y * k, img.width * s, img.height * s);
        put();
        let data = c.toDataURL('image/png');
        if (data.length > 120000) { g.fillStyle = '#141210'; g.fillRect(0, 0, O, O); put(); data = c.toDataURL('image/jpeg', .88); }   // รูปถ่าย → JPEG ให้เล็กลง
        $('[data-a=use]', sh).classList.add('busy');
        await saveLogo(data, LOGO.shape, false, 'บันทึกโลโก้แล้ว');
        URL.revokeObjectURL(url);
      });
    const ci = $('#ci', sh), cb = $('#cb', sh);
    const draw = () => {
      const s = base * z, w = img.width * s, h = img.height * s, mx = (w - V) / 2, my = (h - V) / 2;
      x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y));
      Object.assign(ci.style, { width: w + 'px', height: h + 'px', left: (V - w) / 2 + x + 'px', top: (V - h) / 2 + y + 'px' });
    };
    let p0 = null;
    cb.onpointerdown = e => { p0 = { px: e.clientX, py: e.clientY, x, y }; cb.setPointerCapture(e.pointerId); };
    cb.onpointermove = e => { if (!p0) return; x = p0.x + e.clientX - p0.px; y = p0.y + e.clientY - p0.py; draw(); };
    cb.onpointerup = cb.onpointercancel = () => { p0 = null; };
    ['touchstart', 'touchmove'].forEach(t => cb.addEventListener(t, e => e.stopPropagation(), { passive: true }));   // ไม่ให้หน้าต่างเลื่อนปิดตอนลากรูป
    $('#cz', sh).oninput = e => { z = +e.target.value; draw(); };
    draw();
  };
  img.src = url;
}

// แก้ช่วงพักประจำ (ยังไม่บันทึกจนกด "บันทึก" ในหน้าร้าน)
function breakSheet(i) {
  const s = B.set, isNew = i < 0;
  const k = isNew ? { days: [0, 1, 2, 3, 4, 5, 6].filter(n => s.week[n].on), from: '12:00', to: '13:00', on: true } : clone(s.breaks[i]);
  const draw = () => `<h3>${isNew ? 'เพิ่มช่วงพัก' : 'แก้ช่วงพัก'}</h3>
    <div class="chips" style="grid-template-columns:repeat(7,1fr);gap:4px">
      ${[1, 2, 3, 4, 5, 6, 0].map(n => `<button class="chip ${k.days.indexOf(n) >= 0 ? 'on' : ''}" data-a="d" data-n="${n}" style="padding:9px 0;font-size:15px">${WD[n].replace('.', '')}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><i class="ti ti-clock mu"></i><span style="flex:1">เวลา</span>
      <select class="bsel" id="kf" style="font-size:20px">${timeOpts(k.from)}</select><small class="mu">ถึง</small><select class="bsel" id="kt" style="font-size:20px">${timeOpts(k.to)}</select></div>
    <div class="err" id="ke2"></div>
    <button class="btn" data-a="ok" style="margin-top:16px">ตกลง</button>
    ${isNew ? '' : '<button class="link" data-a="del" style="color:var(--warn)"><i class="ti ti-trash"></i> ลบช่วงนี้</button>'}`;
  const sh = openSheet(draw(), (a, el) => {
    readSettings();
    k.from = $('#kf', sh).value; k.to = $('#kt', sh).value;
    if (a === 'd') { const n = +el.dataset.n, j = k.days.indexOf(n); j >= 0 ? k.days.splice(j, 1) : k.days.push(n); $('.sbody', sh).innerHTML = draw(); return; }
    if (a === 'del') { s.breaks.splice(i, 1); closeSheet(); return renderSettings(); }
    if (a === 'ok') {
      if (!k.days.length) { $('#ke2', sh).textContent = 'เลือกอย่างน้อย 1 วัน'; return; }
      if (toMin(k.to) <= toMin(k.from)) { $('#ke2', sh).textContent = 'เวลาสิ้นสุดต้องหลังเวลาเริ่ม'; return; }
      if (isNew) s.breaks.push(k); else s.breaks[i] = k;
      closeSheet(); renderSettings(); toast('อย่าลืมกดบันทึก');
    }
  });
  sh.classList.add('big');
}

// แก้ช่วงแต้มคูณ

  const sh = openSheet(draw(), async (a, el) => {

    if (a === 'd') { const n = +el.dataset.n, k = b.days.indexOf(n); k >= 0 ? b.days.splice(k, 1) : b.days.push(n); }
    if (a === 'm') b.mult = +el.dataset.n;
    if (a === 'd' || a === 'm') { $('.sbody', sh).innerHTML = draw(); return; }
    if (a === 'del') { s.boosts.splice(i, 1); closeSheet(); return saveSet(); }

}

  if (a === 'bqpick') return $('#bqfile').click();

  }, 'ไม่ลบ');
  if (a === 'lgshape') return saveLogo(null, b.dataset.s, false, 'เปลี่ยนรูปทรงแล้ว');
  if (a === 'lgdel') return askConfirm('ลบโลโก้ร้าน?', 'ลบโลโก้', () => saveLogo('', 'circle', true, 'ลบโลโก้แล้ว · กลับเป็น ๑๐'), 'ไม่ลบ');
  if (a === 'wtog') { const w = s.week[+b.dataset.n]; w.on = !w.on; return renderSettings(); }
  if (a === 'wsame') { const src = s.week[[1, 2, 3, 4, 5, 6, 0].find(n => s.week[n].on)]; s.week.forEach(w => { if (w.on) { w.open = src.open; w.close = src.close; } }); toast('ตั้งเวลาเดียวกันแล้ว · กดบันทึก'); return renderSettings(); }
  if (a === 'ktog') { const k = s.breaks[+b.dataset.i]; k.on = k.on === false; return renderSettings(); }

async function pinSheet() {

  bindPad($('#pr2', sh), async (v, pad) => {
    if (!oldPin) { oldPin = v; return pad.reset('PIN ใหม่ (4–8 หลัก)'); }
    if (!newPin) { newPin = v; return pad.reset('ใส่ PIN ใหม่อีกครั้ง'); }
    if (v !== newPin) { newPin = ''; return pad.reset('PIN ใหม่ (4–8 หลัก)', 'PIN ใหม่สองครั้งไม่ตรงกัน'); }
    pad.wait('กำลังบันทึก…');

/*** ---------- สรุป ---------- ***/
const RANGES = [['d1', '1 วัน'], ['w1', '1 สัปดาห์'], ['m1', '1 เดือน'], ['m6', '6 เดือน'], ['y1', '1 ปี'], ['y3', '3 ปี'], ['y5', '5 ปี']];
// ตัวเลขย่อ: 1,250 → 1.2K · 2,400,000 → 2.4M
const r1 = x => String(Math.round(x * 10) / 10);
const compact = n => n >= 1e6 ? r1(n / 1e6) + 'M' : n >= 1000 ? r1(n / 1000) + 'K' : String(n);
const thDate = ds => { const [y, m, d] = ymd(ds); return d + ' ' + MO[m - 1] + ' ' + String(y + 543).slice(-2); };

async function showSummary(range) {
  B.view = 'sum'; navOn('sum');
  B.sumRange = range || B.sumRange || store.get('k10_range', 'm1');
  store.set('k10_range', B.sumRange);
  if (!B.sum || B.sum.range !== B.sumRange) $('#app').innerHTML = '<div class="load"><i class="ti ti-scissors"></i></div>';
  else renderSummary();
  let d;
  try { d = await api('barberSummary', B.sumRange); } catch (e) { return; }
  if (B.view !== 'sum' || d.range !== B.sumRange) return;
  B.sum = d;
  renderSummary();
}

function renderSummary() {
  const d = B.sum, c = d.cur, p = d.prev;
  const label = RANGES.find(x => x[0] === d.range)[1];
  // ▲▼ เทียบช่วงก่อนหน้า (pct = เป็นเปอร์เซ็นต์ · money = เป็นบาท)
  const dl = (k, pct, money) => {
    if (!p) return '';
    const diff = c[k] - p[k];
    if (Math.abs(diff) < 0.05) return '<small class="mu">เท่าเดิม</small>';
    const v = pct ? (p[k] ? Math.round(Math.abs(diff) / p[k] * 100) + '%' : '') : (money ? '฿' + compact(Math.abs(diff)) : r1(Math.abs(diff)));
    return v ? `<small class="${diff > 0 ? 'up' : 'dn'}">${diff > 0 ? '▲' : '▼'} ${v}</small>` : '';
  };
  const k = (lab, val, sub) => `<div class="k"><span class="mu">${lab}</span><b>${val}</b>${sub || '<small>&nbsp;</small>'}</div>`;
  const money = c.priced || (p && p.priced);
  const cards = [
    money ? k('รายได้', '฿' + compact(c.revenue), dl('revenue', true)) : '',
    money ? k('เฉลี่ย/หัว', '฿' + compact(c.perHead), dl('perHead', false, true)) : '',
    c.cash || c.transfer ? k('เงินสด', '฿' + compact(c.cash), `<small class="mu">${Math.round(c.cash / c.revenue * 100)}%</small>`) : '',
    c.cash || c.transfer ? k('โอน', '฿' + compact(c.transfer), `<small class="mu">${Math.round(c.transfer / c.revenue * 100)}%</small>`) : '',
    k('ลูกค้า', compact(c.customers), dl('customers', true)),
    d.range === 'd1' ? '' : k('เฉลี่ย/วัน', r1(c.avg), dl('avg')),
    k('ลูกค้าใหม่', compact(c.newC), dl('newC')),
    k('ไม่มา', compact(c.noshow), `<small class="mu">${c.noshowPct}%</small>`),
    k('ยกเลิก', compact(c.cancelled), `<small class="mu">${c.cancelPct}%</small>`),
    k('จองออนไลน์', c.customers ? c.online + '%' : '–', c.customers ? `<small class="mu">walk-in ${100 - c.online}%</small>` : '')
  ].join('');
  const period = d.range === 'd1' ? 'วันนี้ ' + thDate(d.to) : thDate(d.from) + ' – ' + thDate(d.to);
  const left = `<div>
    <div class="head" style="margin-bottom:8px;align-items:center"><span class="sv brand">สรุป</span>
      <span class="rsel"><select id="rg" aria-label="ช่วงเวลา">${RANGES.map(([v, l]) => `<option value="${v}" ${v === d.range ? 'selected' : ''}>${l}</option>`).join('')}</select><i class="ti ti-chevron-down"></i></span></div>
    <div class="mu" style="margin-bottom:12px">${period}${p ? ' · เทียบ ' + label + 'ก่อนหน้า' : ''}</div>
    <div class="kgrid">${cards}</div>
    ${money ? '' : '<div class="mu" style="margin-top:10px;font-size:12px"><i class="ti ti-info-circle"></i> รายได้จะขึ้นเมื่อเริ่มบันทึกราคาตอนกดเสร็จ</div>'}</div>`;
  $('#app').className = 'wrap';
  $('#app').innerHTML = `<div class="sum">${left}<div style="margin-top:22px">${d.range === 'd1' ? barsHtml(d) : heatHtml(d)}</div></div>`;
  $('#rg').onchange = e => showSummary(e.target.value);
  $('#app').querySelectorAll('[data-hm]').forEach(el => { el.onclick = () => toast(el.dataset.hm); });
}

// วันนี้: แท่งรายชั่วโมง
function barsHtml(d) {
  const v = d.today, max = Math.max(1, ...v);
  if (!v.some(Boolean)) return '<div class="mu" style="text-align:center;padding:40px 0">วันนี้ยังไม่มีคิวที่ตัดเสร็จ</div>';
  return `<div class="mu" style="margin-bottom:26px"><i class="ti ti-clock"></i> ลูกค้าแต่ละชั่วโมง</div>
    <div class="bars">${v.map(n => `<span style="height:${n / max * 100}%;opacity:${n ? (.35 + .65 * n / max).toFixed(2) : .25}">${n ? `<b>${n}</b>` : ''}</span>`).join('')}</div>
    <div style="display:flex;gap:5px;margin-top:4px">${d.hours.map(h => `<span class="mu" style="flex:1;text-align:center;font-size:12px">${h}</span>`).join('')}</div>`;
}

// วัน × ชั่วโมง
function heatHtml(d) {
  const H = d.hours, order = [1, 2, 3, 4, 5, 6, 0];
  const max = Math.max(0, ...d.heat.map(r => Math.max(...r)));
  if (!max) return '<div class="mu" style="text-align:center;padding:40px 0">ยังไม่มีคิวที่ตัดเสร็จในช่วงนี้</div>';
  // ช่วง 2 ชั่วโมงที่คนเยอะสุด / เงียบสุด (เฉพาะวันที่ร้านเปิด)
  let hi = null, lo = null;
  order.filter(w => d.closedDays.indexOf(w) < 0).forEach(w => {
    for (let i = 0; i + 1 < H.length; i++) {
      const n = d.heat[w][i] + d.heat[w][i + 1];
      if (!hi || n > hi.n) hi = { w, i, n };
      if (d.brk && (d.brk[w][i] || d.brk[w][i + 1])) continue;   // ช่วงพัก ไม่ใช่ช่วงเงียบ
      if (!lo || n < lo.n) lo = { w, i, n };
    }
  });
  const span = x => `${WD[x.w].replace('.', '')} ${H[x.i]}:00–${H[x.i] + 2}:00`;
  const cell = (w, i) => {
    const n = d.heat[w][i], a = n ? .14 + .86 * n / max : 0;
    return `<i data-hm="${WD_FULL[w]} ${H[i]}:00–${H[i] + 1}:00 · ${n} คน" style="background:${n ? `rgba(201,166,107,${a.toFixed(2)})` : 'var(--line)'}"></i>`;
  };
  return `${hi ? `<div class="mu" style="margin-bottom:10px"><i class="ti ti-flame"></i> คนเยอะสุด <span class="au">${span(hi)}</span>${lo && lo.n < hi.n ? ` · เงียบสุด <span style="color:var(--text)">${span(lo)}</span>` : ''}</div>` : ''}
    <div class="hm" style="grid-template-columns:26px repeat(${H.length},1fr)">
      <span></span>${H.map(h => `<span>${h}</span>`).join('')}
      ${order.map(w => `<span class="dl" style="${d.closedDays.indexOf(w) >= 0 ? 'opacity:.4' : ''}">${WD[w].replace('.', '')}</span>${H.map((h, i) => cell(w, i)).join('')}`).join('')}
    </div>
    <div class="mu" style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px">น้อย
      <span style="flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line),var(--gold))"></span>มาก (${max} คน) · แตะช่องดูจำนวน</div>`;
}

const MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

async function memberSheet(phone) {

// QR พร้อมเพย์ (มาตรฐาน EMVCo ที่แอปธนาคารไทยอ่านได้) · amount = 0 คือไม่ระบุยอด
function ppPayload(id, amount) {
  const f = (t, v) => t + String(v.length).padStart(2, '0') + v;
  id = String(id).replace(/\D/g, '');
  const acc = id.length === 10 ? f('01', '0066' + id.slice(1)) : id.length === 13 ? f('02', id) : f('03', id);
  let s = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + acc) + f('58', 'TH') + f('53', '764') +
    (amount ? f('54', (+amount).toFixed(2)) : '') + '6304';
  let crc = 0xFFFF;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
    crc &= 0xFFFF;
  }
  return s + crc.toString(16).toUpperCase().padStart(4, '0');
}
function ppQrImg(id, amount) {
  if (typeof qrcode !== 'function') return '<div class="mu">โหลดตัวสร้าง QR ไม่ได้</div>';
  const q = qrcode(0, 'M'); q.addData(ppPayload(id, amount)); q.make();
  return q.createImgTag(6, 12).replace('<img', '<img class="ppqr" alt="QR พร้อมเพย์"');
}
const maskPP = id => id ? (id.length === 10 ? id.slice(0, 3) + '-xxx-' + id.slice(6) : 'xxxx' + id.slice(-4)) : '';
// รูป QR ธนาคาร: เก็บในเครื่อง โหลดใหม่เมื่อร้านเปลี่ยนรูป
let BQ = store.get('k10_bq', { ver: '', data: '' });
async function ensureBankQr(ver) {
  if (!ver) return '';
  if (BQ.ver === ver && BQ.data) return BQ.data;
  const r = await api('barberBankQr').catch(() => null);
  if (r && r.data) { BQ = r; store.set('k10_bq', r); }
  return BQ.data;
}
// หน้าจอรับเงิน: QR พร้อมเพย์ (ใส่ยอดให้) หรือ QR ธนาคาร (ลูกค้าพิมพ์ยอดเอง) + ปุ่มได้รับเงินโอน / เงินสด
// onPick ไม่ส่งมา = ดูอย่างเดียว · src = ข้อมูลร้าน (ค่าเริ่มต้นจากหน้าคิว)
async function paySheet(amount, onPick, mode, src) {
  src = src || B.d;
  mode = mode || (src.pp ? 'pp' : 'bank');
  const bq = mode === 'bank' ? await ensureBankQr(src.bq) : '';
  const other = mode === 'pp' ? (src.bq ? 'bank' : '') : (src.pp ? 'pp' : '');
  const sh = stackSheet(`<div style="text-align:center">
    <div class="mu">สแกนจ่าย · ${mode === 'pp' ? 'พร้อมเพย์' : 'QR ธนาคาร'}</div>
    ${amount ? `<div class="sv au" style="font-size:46px;line-height:1.2">฿${amount}</div>` : '<div class="mu" style="margin:6px 0">ไม่ระบุยอด · ลูกค้าใส่ยอดเอง</div>'}
    <div class="ppbox">${mode === 'pp' ? ppQrImg(src.pp, amount) : bq ? `<img src="${bq}" alt="QR ธนาคาร" style="image-rendering:auto">` : '<div class="mu" style="color:#555;padding:30px">โหลดรูป QR ไม่ได้</div>'}</div>
    <div class="mu" style="margin:8px 0 ${other ? 6 : 14}px">${mode === 'pp' ? `${esc(src.ppName || '๑๐ กันยา')} · พร้อมเพย์ ${esc(maskPP(src.pp))}` : (amount ? `<span class="au">ลูกค้าพิมพ์ยอด ฿${amount} เอง</span>` : 'QR จากแอปธนาคารของร้าน')}</div>

// อัปโหลดรูป QR ธนาคาร: ย่อให้กว้างไม่เกิน 720px (QR ยังคมพอสแกน)
function pickBankQr(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onerror = () => toast('เปิดรูปนี้ไม่ได้');
  img.onload = async () => {
    const k = Math.min(1, 720 / img.width), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    let data = c.toDataURL('image/png');
    if (data.length > 380000) data = c.toDataURL('image/jpeg', .92);
    URL.revokeObjectURL(url);
    const r = await api('barberSetBankQr', data, false).catch(() => null);
    if (!r) return;
    if (!r.ok) return toast(r.msg);
    BQ = { ver: r.ver, data: data }; store.set('k10_bq', BQ);
    B.setSaved.bankQrVer = B.set.bankQrVer = r.ver;
    renderSettings(); toast('บันทึก QR ธนาคารแล้ว'); loadDay(B.date).catch(() => {});
  };
  img.src = url;
}
